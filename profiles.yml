# dbt profile for RevOps Intelligence Engine
revops_intelligence_engine:
  target: local
  outputs:
    dev:
      type: duckdb
      path: 'md:revops_intelligence'
      threads: 4
    local:
      type: duckdb
      path: 'duckdb/revops_intelligence.duckdb'
      threads: 1
    ci:
      type: duckdb
      path: "{{ env_var('DBT_DB_PATH', 'duckdb/revops_intelligence_ci.duckdb') }}"
      threads: 4
