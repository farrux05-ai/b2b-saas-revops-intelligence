# ============================================================
# dbt Profile — RevOps Intelligence Engine
#
# SINGLE TARGET: Snowflake (production enterprise warehouse)
#
# All dbt runs — local development, CI, and production —
# execute against Snowflake. No local DuckDB or MotherDuck.
#
# REQUIRED ENVIRONMENT VARIABLES (.env or Dagster Cloud Secrets):
#   SNOWFLAKE_ACCOUNT    — e.g. xy12345.us-east-1
#   SNOWFLAKE_USER       — your Snowflake username
#   SNOWFLAKE_PASSWORD   — your Snowflake password
#   SNOWFLAKE_ROLE       — (optional, default: TRANSFORMER)
#   SNOWFLAKE_WAREHOUSE  — (optional, default: COMPUTE_WH)
#   SNOWFLAKE_DATABASE   — (optional, default: REVOPS_INTELLIGENCE)
#
# USAGE:
#   dbt run                    # uses 'snowflake' (default)
#   dbt run --target snowflake # explicit
#   dbt run --target ci        # GitHub Actions (same Snowflake, separate schema)
# ============================================================

revops_intelligence_engine:
  target: snowflake
  outputs:

    # ── PRODUCTION / LOCAL DEV — Snowflake ──────────────────
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVOPS_INTELLIGENCE') }}"
      schema: MARTS
      threads: 8
      client_session_keep_alive: false
      query_tag: "dbt_revops_intelligence"

    # ── CI — Snowflake (isolated schema) ────────────────────
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVOPS_INTELLIGENCE') }}"
      schema: MARTS_CI
      threads: 4
      client_session_keep_alive: false
      query_tag: "dbt_revops_ci"

# ── Elementary observability — mirrors main profile ──────────
elementary:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVOPS_INTELLIGENCE') }}"
      schema: ELEMENTARY
      threads: 4
      query_tag: "elementary_revops"
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'REVOPS_INTELLIGENCE') }}"
      schema: ELEMENTARY_CI
      threads: 4
      query_tag: "elementary_revops_ci"
