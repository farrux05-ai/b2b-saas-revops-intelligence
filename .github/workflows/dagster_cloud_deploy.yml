# .github/workflows/dagster_cloud_deploy.yml
# ===========================================
# SentinelGuard RevOps — Dagster+ Serverless Deploy
#
# REFERENCE: dagster-io/dagster-cloud-serverless-quickstart (official template)
# ACTION VERSION: @v1.13.5 (verified latest tag from GitHub releases)
#
# WHY 6 STEPS?
#   Dagster's CI/CD workflow operates as a state machine:
#   prerun → checkout → ci-init (creates statedir) → build → deploy → summary
#   The previous "Missing option --statedir" error occurred because the ci-init step was missing.
#   Each step depends on the output/state initialized by the previous step.
#
# GITHUB SECRETS REQUIRED:
#   DAGSTER_CLOUD_API_TOKEN — Generated in dagster.cloud → Settings → Tokens → Create User Token
#                             Prefix: dagster_cloud_user_...
#
# GITHUB ENV VARS REQUIRED (Set under Repository Settings -> Variables):
#   DAGSTER_CLOUD_ORGANIZATION — Your organization name in Dagster Cloud
#   Example: https://acme.dagster.cloud → "acme" (currently hardcoded as "farrux-inc")

name: Dagster Cloud — Serverless Deploy

on:
  push:
    branches:
      - main
      - master

# concurrency: Prevents concurrent deploys to the same branch.
# If you push updates in rapid succession, the previous run is canceled
# to prevent state conflicts on the target Dagster Cloud deployment.
concurrency:
  group: ${{ github.ref }}/deploy
  cancel-in-progress: true

# Global environment variables
env:
  DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
  DAGSTER_CLOUD_ORGANIZATION: 'farrux-inc'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # DAGSTER_CLOUD_YAML_PATH: Directory where dagster_cloud.yaml is located.
  # "." = repository root.
  DAGSTER_CLOUD_YAML_PATH: '.'
  DAGSTER_CLOUD_FILE: 'dagster_cloud.yaml'

  # ENABLE_FAST_DEPLOYS: Enables "pex-deploy" strategy.
  # PEX (Python EXecutable) builds are much faster than full Docker builds:
  # Python packages are archived directly instead of rebuilding full OS layers.
  # Docker build: ~3-5 mins | PEX build: ~30-60 secs.
  ENABLE_FAST_DEPLOYS: 'true'
  PYTHON_VERSION: '3.10'

jobs:
  dagster_cloud_default_deploy:
    name: Dagster Serverless Deploy
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------------------------------------------
      # 1. PRERUN — Evaluates deployment strategy and checks connectivity
      #
      # Checks API credentials and resolves the build strategy.
      # Output (steps.prerun.outputs.result):
      #   "pex-deploy"    → Build a python-executable archive (fast)
      #   "docker-deploy" → Build a standard Docker image (fallback)
      #   "skip"          → No deployment needed
      # -----------------------------------------------------------------
      - name: Prerun Checks
        id: prerun
        uses: dagster-io/dagster-cloud-action/actions/utils/prerun@v1.13.5

      # -----------------------------------------------------------------
      # 2. CHECKOUT — Pulls code from repository
      #
      # fetch-depth: 0 — Pulls complete git history (required by Dagster CLI).
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # -----------------------------------------------------------------
      # 3. GENERATE manifest.json — Required by @dbt_assets decorator
      #
      # Why is this needed?
      #   target/ is in .gitignore, so manifest.json is never committed.
      #   Dagster's @dbt_assets reads manifest.json at import time to discover
      #   all dbt models. Without it, the Cloud agent raises:
      #   DagsterDbtManifestNotFoundError: .../target/manifest.json does not exist.
      #
      # `dbt parse` (not `dbt compile`) — parses the dbt project structure and
      #   generates manifest.json WITHOUT connecting to any database.
      #   It's fast, safe, and side-effect free.
      #
      # profiles.yml: The ci profile uses duckdb with an in-memory database
      #   (path=":memory:") so no credentials are needed in CI.
      # -----------------------------------------------------------------
      - name: Set up Python for dbt
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dbt-duckdb
        run: pip install dbt-duckdb

      - name: Install dbt packages (dbt deps)
        run: dbt deps

      - name: Generate dbt manifest.json
        run: dbt parse --target ci
        # If your profiles.yml does not have a 'ci' target, fall back to default:
        # run: dbt parse

      # -----------------------------------------------------------------
      # 3. CI INIT — Initializes build session (Creates DAGSTER_BUILD_STATEDIR)
      #
      # Resolves the "--statedir" error.
      # Functions:
      #   a) Creates a unique build session workspace directory.
      #   b) Validates configuration details against dagster_cloud.yaml.
      #   c) Sets deployment target ('prod').
      # -----------------------------------------------------------------
      - name: Initialize build session
        id: ci-init
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/ci-init@v1.13.5
        with:
          project_dir: ${{ env.DAGSTER_CLOUD_YAML_PATH }}
          dagster_cloud_yaml_path: ${{ env.DAGSTER_CLOUD_FILE }}
          deployment: 'prod'

      # -----------------------------------------------------------------
      # 4a. PEX BUILD (Fast Deploy) — Python archive execution
      #
      # Runs only if prerun resolved to 'pex-deploy'.
      # Builds a standalone Python environment with project dependencies.
      # -----------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        id: setup-python
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install setuptools (PEX dependency)
        if: steps.prerun.outputs.result == 'pex-deploy'
        run: ${{ steps.setup-python.outputs.python-path }} -m pip install setuptools
        shell: bash

      - name: Build PEX artifact
        id: run-pex-build
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.5
        with:
          command: "ci build --build-strategy=python-executable --python-version ${{ env.PYTHON_VERSION }}"

      # -----------------------------------------------------------------
      # 4b. DOCKER BUILD (Standard Deploy) — Docker image build
      #
      # Runs only if prerun resolved to 'docker-deploy'.
      # -----------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.prerun.outputs.result == 'docker-deploy'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: run-docker-build
        if: steps.prerun.outputs.result == 'docker-deploy'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.5
        with:
          command: "ci build --build-strategy=docker --python-version ${{ env.PYTHON_VERSION }}"

      # -----------------------------------------------------------------
      # 5. CI DEPLOY — Uploads build to Dagster Cloud
      #
      # Finalizes the build session and registers new code locations.
      # -----------------------------------------------------------------
      - name: Deploy to Dagster Cloud
        id: ci-deploy
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.5
        with:
          command: "ci deploy"

      # -----------------------------------------------------------------
      # 6. SUMMARY — Generates a run report in GitHub Actions
      #
      # Appends markdown status to $GITHUB_STEP_SUMMARY.
      # -----------------------------------------------------------------
      - name: Generate deploy summary
        id: ci-summary
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.13.5
        with:
          command: "ci status --output-format=markdown >> $GITHUB_STEP_SUMMARY"
