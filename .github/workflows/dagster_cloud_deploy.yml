name: Dagster Cloud Deploy
on:
  push:
    branches:
      - main
      - master

jobs:
  dagster_cloud_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Dagster Cloud Deploy
        uses: dagster-io/dagster-cloud-action@0.1.34
        with:
          dagster_cloud_api_token: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          location: |
            {
              "name": "revops-intelligence",
              "directory": ".",
              "file": "dagster_pipeline.py"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
