name: Terraform — Snowflake Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

  workflow_dispatch:

env:
  TF_WORKING_DIR: terraform/environments/prod
  TF_VERSION: "1.9.5"

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Format & Validate — runs on every PR
  # ─────────────────────────────────────────────────────────
  terraform_validate:
    name: 🔍 Terraform Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🎨 Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform/

      - name: 🔌 Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: ✅ Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ─────────────────────────────────────────────────────────
  # JOB 2: Plan — runs on PRs, posts results as a comment
  # ─────────────────────────────────────────────────────────
  terraform_plan:
    name: 📋 Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform_validate
    if: github.event_name == 'pull_request'

    env:
      TF_VAR_snowflake_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_snowflake_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_TF_USERNAME }}
      TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_TF_PASSWORD }}
      TF_VAR_dbt_prod_password: ${{ secrets.DBT_PROD_PASSWORD }}
      TF_VAR_dbt_ci_password: ${{ secrets.DBT_CI_PASSWORD }}
      TF_VAR_dlt_loader_password: ${{ secrets.DLT_LOADER_PASSWORD }}
      TF_VAR_lightdash_password: ${{ secrets.LIGHTDASH_PASSWORD }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔌 Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 📋 Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=plan.out 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: 💬 Post Plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... (truncated)'
              : planOutput;

            const body = `## 🏗️ Terraform Plan — Snowflake Infrastructure

            <details><summary>📋 Show Plan Output</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            **Plan exit code:** \`${{ steps.plan.outputs.exitcode }}\`

            > ⚠️ Review carefully before merging. \`terraform apply\` runs automatically on merge to \`main\`.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: ❌ Fail if Plan Failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  # ─────────────────────────────────────────────────────────
  # JOB 3: Apply — runs ONLY on merge to main
  # ─────────────────────────────────────────────────────────
  terraform_apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform_validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://app.snowflake.com

    env:
      TF_VAR_snowflake_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_snowflake_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_TF_USERNAME }}
      TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_TF_PASSWORD }}
      TF_VAR_dbt_prod_password: ${{ secrets.DBT_PROD_PASSWORD }}
      TF_VAR_dbt_ci_password: ${{ secrets.DBT_CI_PASSWORD }}
      TF_VAR_dlt_loader_password: ${{ secrets.DLT_LOADER_PASSWORD }}
      TF_VAR_lightdash_password: ${{ secrets.LIGHTDASH_PASSWORD }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: 🔌 Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 🚀 Terraform Apply
        run: terraform apply -auto-approve -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: 📤 Upload Terraform State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-state-prod
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          retention-days: 90
