name: dbt Slim CI & Observability

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: SQLFluff — SQL Stil Tekshiruvi
  # ─────────────────────────────────────────────────────────
  sqlfluff_lint:
    name: 🔍 SQLFluff Lint (models/)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install SQLFluff
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff sqlfluff-templater-dbt dbt-snowflake==1.9.0

      - name: 🔌 Install dbt Packages
        run: dbt deps

      - name: 🧹 Run SQLFluff Lint
        run: |
          sqlfluff lint models/ \
            --dialect snowflake \
            --templater dbt \
            --processes 4

  # ─────────────────────────────────────────────────────────
  # JOB 2: dbt Slim CI — Faqat O'zgargan Modellar
  # ─────────────────────────────────────────────────────────
  slim_ci:
    name: 🚀 dbt Slim CI (Snowflake)
    runs-on: ubuntu-latest
    needs: sqlfluff_lint

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake==1.9.0 elementary-data==0.25.1 dlt duckdb

      - name: 🔌 Install dbt Packages
        run: |
          dbt deps

      - name: 📂 Download Main Branch Manifest (State Deferral)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: dbt-manifest
          path: ./state
          branch: main

      - name: 🔍 Compile Fallback State (If Main Manifest Not Found)
        run: |
          if [ ! -f ./state/manifest.json ]; then
            echo "⚠️  Main manifest not found in artifacts. Compiling baseline manifest..."
            mkdir -p ./state
            dbt parse --target snowflake --profiles-dir .
            cp target/manifest.json ./state/manifest.json
          fi

      - name: 🚀 Run dbt Slim CI (Modified Models & Downstream Dependencies Only)
        run: |
          dbt build \
            --target ci \
            --profiles-dir . \
            --select state:modified+ \
            --defer \
            --state ./state \
            --store-failures

      - name: 📤 Upload Production Manifest Artifact (For Future PR Deferral)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: target/manifest.json
          retention-days: 30
