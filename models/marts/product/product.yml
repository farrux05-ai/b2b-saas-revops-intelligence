version: 2
models:
- name: fct_product_activation
  description: Product Activation Mart.
  config:
    meta:
      label: Product Activation
  columns:
  - name: workspace_id
    config:
      meta:
        label: Workspace ID
        metrics:
          total_activated_workspaces:
            type: count_distinct
            label: Total Activated Workspaces
  - name: account_id
    config:
      meta:
        label: Account ID
  - name: total_users
    config:
      meta:
        label: Total Users
        metrics:
          total_users_sum:
            type: sum
            label: Total Users Sum
  - name: activated_users
    config:
      meta:
        label: Activated Users
        metrics:
          activated_users_sum:
            type: sum
            label: Activated Users Sum
  - name: active_users_last_30d
    config:
      meta:
        label: Active Users Last 30 Days
        metrics:
          sum_active_users_30d:
            type: sum
            label: Active Users 30d Sum
  - name: activation_rate
    config:
      meta:
        format: percent
        label: Activation Rate
        metrics:
          avg_activation_rate:
            type: average
            format: percent
            label: Average Activation Rate
  - name: company_name
    config:
      meta:
        label: Company Name
- name: fct_pql_signals
