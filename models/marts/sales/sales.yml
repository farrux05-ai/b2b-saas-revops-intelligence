version: 2
models:
- name: fct_pipeline
  description: 'Sales Deal Pipeline Mart. One row per HubSpot deal. Sourced from int_deals_enriched
    (resolves Anti-pattern #13).

    '
  config:
    meta:
      label: Sales Deal Pipeline
  columns:
  - name: hubspot_deal_id
    description: Grain. HubSpot deal ID.
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Deal ID
        metrics:
          total_deals:
            type: count_distinct
            label: Total Deal Count
  - name: account_id
    description: FK to dim_accounts.
    config:
      meta:
        label: Account ID
  - name: deal_amount
    description: Deal amount in USD.
    tests:
    - not_null
    config:
      meta:
        format: usd
        label: Deal Amount
        metrics:
          total_pipeline_value:
            type: sum
            label: Total Pipeline Value ($)
            format: usd
  - name: win_probability
    description: "Win probability percentage (0\u2013100)."
    tests:
    - not_null
    config:
      meta:
        format: percent
        label: Win Probability
  - name: deal_stage
    config:
      meta:
        label: Deal Stage
  - name: account_segment
    config:
      meta:
        label: Account Segment
  - name: weighted_amount
    config:
      meta:
        format: usd
        label: Weighted Amount
        metrics:
          weighted_pipeline_value:
            type: sum
            label: Weighted Pipeline Value ($)
            format: usd
  - name: is_stale
    config:
      meta:
        label: Is Stale
        metrics:
          stale_deals:
            type: count_distinct
            sql: case when ${is_stale} then ${hubspot_deal_id} else null end
            label: Stale Deals Count
- name: fct_activities
  description: 'Sales Activity Log (Incremental). One row per HubSpot engagement.
    Sourced directly from stg_hubspot__engagements for row-level event granularity.

    '
  config:
    meta:
      label: Sales Activity Log
  columns:
  - name: activity_id
    description: Grain. HubSpot engagement ID.
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Activity ID
        metrics:
          total_activities:
            type: count_distinct
            label: Total Sales Activities
  - name: account_id
    description: FK to dim_accounts.
    config:
      meta:
        label: Account ID
  - name: activity_type
    tests:
    - accepted_values:
        arguments:
          values:
          - CALL
          - EMAIL
          - MEETING
    config:
      meta:
        label: Activity Type
