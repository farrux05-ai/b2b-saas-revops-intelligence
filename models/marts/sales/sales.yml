version: 2
models:
- name: fct_pipeline
  description: Sales Deal Pipeline Mart.
  config:
    meta:
      label: Sales Deal Pipeline
  columns:
  - name: hubspot_deal_id
    config:
      meta:
        label: Deal ID
        metrics:
          total_deals:
            type: count_distinct
            label: Total Deal Count
  - name: account_id
    config:
      meta:
        label: Account ID
  - name: deal_amount
    config:
      meta:
        format: usd
        label: Deal Amount
        metrics:
          total_pipeline_value:
            type: sum
            format: usd
            label: Total Pipeline Value ($)
  - name: win_probability
    config:
      meta:
        format: percent
        label: Win Probability
  - name: deal_stage
    config:
      meta:
        label: Deal Stage
  - name: account_segment
    config:
      meta:
        label: Account Segment
  - name: weighted_amount
    config:
      meta:
        format: usd
        label: Weighted Amount
        metrics:
          weighted_pipeline_value:
            type: sum
            format: usd
            label: Weighted Pipeline Value ($)
  - name: is_stale
    config:
      meta:
        label: Is Stale
        metrics:
          stale_deals:
            type: count_distinct
            sql: case when ${is_stale} then ${hubspot_deal_id} else null end
            label: Stale Deals Count
  - name: company_name
    config:
      meta:
        label: Company Name
- name: fct_activities
  description: Sales Activity Log.
  config:
    meta:
      label: Sales Activity Log
  columns:
  - name: activity_id
    config:
      meta:
        label: Activity ID
        metrics:
          total_activities:
            type: count_distinct
            label: Total Sales Activities
  - name: hubspot_company_id
    config:
      meta:
        label: HubSpot Company ID
  - name: owner_id
    config:
      meta:
        label: Owner ID
  - name: activity_type
    config:
      meta:
        label: Activity Type
  - name: activity_at
    config:
      meta:
        label: Activity Timestamp
  - name: activity_date
    config:
      meta:
        label: Activity Date
  - name: company_name
    config:
      meta:
        label: Company Name
  - name: workspace_name
    config:
      meta:
        label: Workspace Name
