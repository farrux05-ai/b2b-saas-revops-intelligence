version: 2

# =============================================================================
# SEMANTIC LAYER: Sales Domain
#
# Deal pipeline analysis, sales activity tracking, and forecast metrics.
# =============================================================================

models:
  # ─── fct_pipeline ──────────────────────────────────────────────────────────
  - name: fct_pipeline
    description: >
      Sales deal pipeline. One row per HubSpot deal. Shows pipeline position,
      weighted forecast amounts, deal velocity, and account context.
      Used for pipeline reviews and revenue forecasting.
    meta:
      label: "Deal Pipeline"
      group_label: "Sales"
    columns:
      - name: hubspot_deal_id
        description: "HubSpot deal record ID."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_deals:
              type: count_distinct
              label: "Total Deals"

      - name: deal_name
        description: "Name of the deal in HubSpot."
        meta:
          dimension:
            label: "Deal Name"

      - name: hubspot_company_id
        description: "FK to the associated company."
        meta:
          dimension:
            hidden: true

      - name: account_id
        description: "FK to dim_accounts."
        meta:
          dimension:
            hidden: true

      - name: workspace_name
        description: "Account workspace name."
        meta:
          dimension:
            label: "Account"

      - name: domain
        description: "Account domain."
        meta:
          dimension:
            label: "Domain"

      - name: account_segment
        description: "Account revenue segment."
        meta:
          dimension:
            label: "Account Segment"

      - name: pipeline
        description: "HubSpot pipeline name."
        meta:
          dimension:
            label: "Pipeline"

      - name: deal_stage
        description: "Current deal stage (e.g. appointmentscheduled, closedwon, closedlost)."
        meta:
          dimension:
            label: "Deal Stage"

      - name: deal_amount
        description: "Deal value in USD."
        tests: [not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_pipeline_value:
              type: sum
              label: "Total Pipeline Value"
              description: "Sum of all deal amounts."
              format: "usd"
            avg_deal_size:
              type: average
              label: "Avg Deal Size"
              format: "usd"

      - name: win_probability
        description: "Win probability percentage (0–100)."
        tests: [not_null]
        meta:
          dimension:
            hidden: true

      - name: weighted_amount
        description: "Deal amount × win probability. Forecast metric."
        meta:
          dimension:
            hidden: true
          metrics:
            total_weighted_pipeline:
              type: sum
              label: "Weighted Pipeline"
              description: "Sum of (deal_amount × probability). Revenue forecast."
              format: "usd"

      - name: is_won
        description: "True if deal is closed-won."
        meta:
          dimension:
            label: "Won"
            type: boolean
          metrics:
            won_deals:
              type: count_distinct
              sql: "${hubspot_deal_id}"
              label: "Won Deals"
              filters:
                - field: is_won
                  operator: "is"
                  value: "true"

      - name: is_lost
        description: "True if deal is closed-lost."
        meta:
          dimension:
            label: "Lost"
            type: boolean

      - name: is_open
        description: "True if deal is still in progress."
        meta:
          dimension:
            label: "Open"
            type: boolean

      - name: created_at
        description: "Deal creation timestamp."
        meta:
          dimension:
            label: "Created"
            type: timestamp

      - name: closed_at
        description: "Deal close timestamp (null if still open)."
        meta:
          dimension:
            label: "Closed"
            type: timestamp

      - name: days_to_close
        description: "Number of days from deal creation to close."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_days_to_close:
              type: average
              label: "Avg Sales Cycle (Days)"
              description: "Average number of days to close a deal."
              round: 0

      - name: days_open
        description: "Number of days the deal has been open (for active deals only)."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_days_open:
              type: average
              label: "Avg Days Open"
              round: 0

      - name: is_stale
        description: "True if the deal has been open for more than 90 days without closing."
        meta:
          dimension:
            label: "Stale Deal"
            type: boolean
          metrics:
            stale_deals:
              type: count_distinct
              sql: "${hubspot_deal_id}"
              label: "Stale Deals (90d+)"
              filters:
                - field: is_stale
                  operator: "is"
                  value: "true"

      - name: deal_age_bucket
        description: "Categorical bucket for deal age: 0-30 days, 31-60 days, 61-90 days, 90+ days (Stale), Closed."
        meta:
          dimension:
            label: "Deal Age"

      - name: avg_won_days_to_close
        description: "Portfolio-wide average days to close for won deals. Window function — same value on every row."
        meta:
          dimension:
            hidden: true
          metrics:
            benchmark_days_to_close:
              type: average
              label: "Benchmark: Avg Days to Close (Won)"
              round: 0

      - name: account_current_mrr
        description: "Current MRR of the account linked to this deal."
        meta:
          dimension:
            hidden: true

      - name: account_health_status
        description: "Health status of the account linked to this deal."
        meta:
          dimension:
            label: "Account Health"

  # ─── fct_activities ────────────────────────────────────────────────────────
  - name: fct_activities
    description: >
      Sales activity log sourced from HubSpot Engagements.
      One row per activity (call, email, meeting). Used for rep productivity
      analysis and account engagement scoring.
    meta:
      label: "Sales Activities"
      group_label: "Sales"
    columns:
      - name: activity_id
        description: "HubSpot engagement ID."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_activities:
              type: count_distinct
              label: "Total Activities"

      - name: hubspot_company_id
        description: "FK to the associated company."
        meta:
          dimension:
            hidden: true

      - name: owner_id
        description: "Sales rep who performed the activity."
        meta:
          dimension:
            label: "Rep ID"

      - name: activity_type
        description: "Type of engagement: CALL, EMAIL, or MEETING."
        meta:
          dimension:
            label: "Activity Type"

      - name: activity_at
        description: "Timestamp of the activity."
        meta:
          dimension:
            label: "Activity Time"
            type: timestamp

      - name: activity_date
        description: "Date of the activity (truncated to day)."
        meta:
          dimension:
            label: "Activity Date"
            type: date
