version: 2

# =============================================================================
# MART SCHEMA: Core
# dim_accounts + dim_users — Foundation models for all GTM teams.
# Includes Lightdash BI metadata (labels, formatting, metrics, joins).
# =============================================================================

models:

  # ─── dim_accounts ──────────────────────────────────────────────────────────
  - name: dim_accounts
    description: >
      Golden Record — Single source of truth for every B2B account.
      Pure SELECT from int_accounts_scored. No complex business logic here.
      Consumed by all GTM teams (Sales, CS, Product, Marketing, Executive).
    config:
      meta:
        label: "Account 360 (Golden Record)"
        joins:
          - join: fct_accounts_health
            sql_on: "${dim_accounts.account_id} = ${fct_accounts_health.account_id}"
          - join: fct_pipeline
            sql_on: "${dim_accounts.account_id} = ${fct_pipeline.account_id}"

    columns:
      - name: account_id
        description: "Stable surrogate key. Primary anchor for all downstream joins."
        tests: [unique, not_null]
        config:
          meta:
            label: "Account ID"

      - name: domain
        description: "Company primary domain."
        config:
          meta:
            label: "Domain"

      - name: company_name
        description: "Company or workspace name."
        config:
          meta:
            label: "Company Name"

      - name: mrr
        description: "Monthly Recurring Revenue (USD)."
        tests: [not_null]
        config:
          meta:
            format: "usd"
            label: "MRR"
            metrics:
              total_mrr:
                type: sum
                label: "Total MRR ($)"
                format: "usd"
              avg_mrr:
                type: average
                label: "Average MRR ($)"
                format: "usd"

      - name: arr
        description: "Annualized Recurring Revenue (mrr * 12). Only allowed calculation in dim_accounts."
        config:
          meta:
            format: "usd"
            label: "ARR"
            metrics:
              total_arr:
                type: sum
                label: "Total ARR ($)"
                format: "usd"

      - name: account_segment
        description: "ARR-based tier: Enterprise | Mid-Market | SMB | Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']
        config:
          meta:
            label: "Account Segment"

      - name: health_status
        description: "Overall account health status: Healthy | At Risk | Churned."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']
        config:
          meta:
            label: "Health Status"

      - name: health_reason
        description: >
          Specific cause: Churned | Payment Failing | Support Critical |
          Low Engagement | Expansion Target | Healthy.
        tests:
          - accepted_values:
              values:
                - 'Churned'
                - 'Payment Failing'
                - 'Support Critical'
                - 'Low Engagement'
                - 'Expansion Target'
                - 'Healthy'
        config:
          meta:
            label: "Health Reason"

      - name: mrr_at_risk
        description: "MRR at risk for At Risk accounts."
        tests: [not_null]
        config:
          meta:
            format: "usd"
            label: "MRR at Risk"
            metrics:
              total_mrr_at_risk:
                type: sum
                label: "Total MRR at Risk ($)"
                format: "usd"

      - name: icp_tier
        description: "ICP Fit tier: High Fit | Medium Fit | Low Fit."
        tests:
          - accepted_values:
              values: ['High Fit', 'Medium Fit', 'Low Fit']
        config:
          meta:
            label: "ICP Fit Tier"

  # ─── dim_users ─────────────────────────────────────────────────────────────
  - name: dim_users
    description: >
      Enriched user directory. Applies PII masking (GDPR/CCPA compliant).
      Selects from int_users_joined with email/name masking.
    config:
      meta:
        label: "User Directory"
        joins:
          - join: dim_accounts
            sql_on: "${dim_users.account_id} = ${dim_accounts.account_id}"

    columns:
      - name: global_user_id
        description: "Stable surrogate key based on internal_user_id."
        tests: [unique, not_null]
        config:
          meta:
            label: "Global User ID"
            metrics:
              total_users:
                type: count_distinct
                label: "Total User Count"

      - name: email
        description: "Masked email address (e.g. j***e@domain.com)."
        tests: [not_null]
        config:
          meta:
            label: "Masked Email"

      - name: hashed_email
        description: "MD5 hash of email for anonymous downstream matching."
        tests: [not_null]
        config:
          meta:
            label: "Hashed Email"

      - name: account_id
        description: "FK to dim_accounts."
        config:
          meta:
            label: "Account ID"
