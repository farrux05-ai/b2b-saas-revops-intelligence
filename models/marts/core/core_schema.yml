version: 2

# =============================================================================
# SEMANTIC LAYER: Core Domain
#
# Lightdash reads dimensions + metrics from this file.
# Every column must be documented with a description.
# Slack Bot answers questions by matching natural-language to these labels.
#
# Convention:
#   - dimensions  → defined via column descriptions + meta.dimension
#   - metrics     → defined via meta.metrics on the column they aggregate
#   - hidden cols → meta.dimension.hidden: true (internal IDs, not for BI)
# =============================================================================

models:
  # ─── dim_accounts: Golden Record ───────────────────────────────────────────
  - name: dim_accounts
    description: >
      Golden Record — single source of truth for every B2B account.
      One row per account. Integrates identity, revenue, health, product,
      and sales data. Used by all GTM teams.
    meta:
      label: "Accounts"
      group_label: "Core"
    columns:
      # ── Identity ──
      - name: account_id
        description: "Stable surrogate key for the account. Use for all downstream joins."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_accounts:
              type: count_distinct
              label: "Total Accounts"
              description: "Count of all unique accounts."

      - name: hubspot_company_id
        description: "Foreign key to HubSpot CRM company record."
        meta:
          dimension:
            hidden: true

      - name: internal_workspace_id
        description: "Foreign key to the internal product workspace."
        meta:
          dimension:
            hidden: true

      - name: domain
        description: "Company website domain (e.g. acme.com). Primary identity key."
        tests: [not_null]
        meta:
          dimension:
            label: "Domain"

      - name: workspace_name
        description: "Internal workspace display name."
        meta:
          dimension:
            label: "Workspace Name"

      - name: hubspot_company_name
        description: "Company name as recorded in HubSpot CRM."
        meta:
          dimension:
            label: "Company Name"

      - name: industry
        description: "Industry vertical (Technology, Healthcare, Finance, etc.)."
        meta:
          dimension:
            label: "Industry"

      - name: utm_source
        description: "First-touch marketing source (Organic Search, Google Ads, LinkedIn, etc.)."
        meta:
          dimension:
            label: "UTM Source"

      - name: utm_campaign
        description: "First-touch marketing campaign identifier."
        meta:
          dimension:
            label: "UTM Campaign"

      # ── Revenue & Expansion ──
      - name: mrr
        description: "Monthly Recurring Revenue in USD."
        tests: [not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_mrr:
              type: sum
              label: "Total MRR"
              description: "Sum of MRR across all accounts."
              format: "usd"
            average_mrr:
              type: average
              label: "Average MRR"
              description: "Average MRR per account."
              format: "usd"

      - name: active_mrr
        description: "MRR only from non-canceled subscriptions."
        meta:
          dimension:
            hidden: true
          metrics:
            total_active_mrr:
              type: sum
              label: "Total Active MRR"
              format: "usd"

      - name: arr
        description: "Annualized Recurring Revenue (MRR × 12)."
        meta:
          dimension:
            hidden: true
          metrics:
            total_arr:
              type: sum
              label: "Total ARR"
              description: "Sum of ARR across all accounts."
              format: "usd"

      - name: account_segment
        description: "Revenue-based tier: Enterprise (≥$50K ARR), Mid-Market ($10K–$50K), SMB (<$10K), Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']
        meta:
          dimension:
            label: "Account Segment"

      - name: subscription_status
        description: "Current Stripe subscription status (active, trialing, past_due, canceled)."
        meta:
          dimension:
            label: "Subscription Status"

      - name: current_plan
        description: "Active pricing plan (starter, growth, enterprise)."
        meta:
          dimension:
            label: "Plan"

      - name: seat_limit
        description: "Maximum number of seats allowed under the current plan."
        meta:
          dimension:
            hidden: true

      - name: seats_used
        description: "Number of seats currently in use."
        meta:
          dimension:
            hidden: true

      - name: seat_utilization_pct
        description: "Percentage of seats in use (0.0–1.0). Above 0.9 = upsell ready."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_seat_utilization:
              type: average
              label: "Avg Seat Utilization"
              description: "Average seat utilization across all accounts."
              format: "percent"

      - name: is_ready_for_upsell
        description: "True when seat utilization ≥ 90%. Expansion signal."
        meta:
          dimension:
            label: "Upsell Ready"
            type: boolean
          metrics:
            upsell_ready_count:
              type: count_distinct
              sql: "${account_id}"
              label: "Upsell-Ready Accounts"
              description: "Accounts where seat usage ≥ 90%."
              filters:
                - field: is_ready_for_upsell
                  operator: "is"
                  value: "true"

      - name: is_churning_soon
        description: "True when the subscription is set to cancel at period end."
        meta:
          dimension:
            label: "Churning Soon"
            type: boolean

      # ── Health, Risk & Churn ──
      - name: health_status
        description: "Account health classification: Healthy, At Risk, Churned."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']
        meta:
          dimension:
            label: "Health Status"
          metrics:
            at_risk_accounts:
              type: count_distinct
              sql: "${account_id}"
              label: "At-Risk Accounts"
              description: "Accounts classified as At Risk."
              filters:
                - field: health_status
                  operator: "equals"
                  value: "At Risk"
            churned_accounts:
              type: count_distinct
              sql: "${account_id}"
              label: "Churned Accounts"
              description: "Accounts classified as Churned."
              filters:
                - field: health_status
                  operator: "equals"
                  value: "Churned"

      - name: health_reason
        description: "Specific reason for health status (Payment Failing, Support Critical, Low Engagement, etc.)."
        meta:
          dimension:
            label: "Health Reason"

      - name: mrr_at_risk
        description: "MRR tied to At-Risk (non-churned) accounts."
        meta:
          dimension:
            hidden: true
          metrics:
            total_mrr_at_risk:
              type: sum
              label: "MRR at Risk"
              description: "Total MRR from accounts that are At Risk."
              format: "usd"

      - name: is_payment_failing
        description: "True when the latest invoice is past_due."
        meta:
          dimension:
            label: "Payment Failing"
            type: boolean

      # ── PLG & Product ──
      - name: is_pql
        description: "Product Qualified Lead flag — activated trial workspace meeting PQL criteria."
        meta:
          dimension:
            label: "Is PQL"
            type: boolean
          metrics:
            pql_count:
              type: count_distinct
              sql: "${account_id}"
              label: "Active PQLs"
              description: "Number of Product Qualified Leads."
              filters:
                - field: is_pql
                  operator: "is"
                  value: "true"

      - name: product_events_count
        description: "Total product telemetry events recorded for this account."
        meta:
          dimension:
            hidden: true
          metrics:
            total_product_events:
              type: sum
              label: "Total Product Events"
            avg_product_events:
              type: average
              label: "Avg Events per Account"

      - name: last_activity_at
        description: "Timestamp of the most recent product event."
        meta:
          dimension:
            label: "Last Active"
            type: timestamp

      # ── CRM & Sales ──
      - name: total_tickets
        description: "Lifetime support ticket count."
        meta:
          dimension:
            hidden: true
          metrics:
            sum_total_tickets:
              type: sum
              label: "Total Support Tickets"

      - name: open_tickets
        description: "Currently open support tickets."
        meta:
          dimension:
            hidden: true
          metrics:
            sum_open_tickets:
              type: sum
              label: "Open Support Tickets"

      - name: high_priority_tickets
        description: "Open high/urgent priority tickets."
        meta:
          dimension:
            hidden: true

      - name: avg_resolution_hours
        description: "Average time (hours) to resolve a support ticket."
        meta:
          dimension:
            hidden: true

      - name: last_ticket_at
        description: "Date of the most recent support ticket."
        meta:
          dimension:
            label: "Last Ticket Date"
            type: timestamp

      - name: open_deals_count
        description: "Number of open CRM deals for this account."
        meta:
          dimension:
            hidden: true
          metrics:
            total_open_deals:
              type: sum
              label: "Open Deals"

      - name: lifetime_revenue
        description: "Total closed-won deal revenue (all time)."
        meta:
          dimension:
            hidden: true
          metrics:
            total_lifetime_revenue:
              type: sum
              label: "Lifetime Revenue"
              format: "usd"

      - name: last_won_date
        description: "Date of the last closed-won deal."
        meta:
          dimension:
            label: "Last Won Date"
            type: timestamp

      - name: last_updated_at
        description: "Audit timestamp — when this record was last refreshed."
        meta:
          dimension:
            hidden: true

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1

  # ─── dim_users: User Directory ─────────────────────────────────────────────
  - name: dim_users
    description: >
      Enriched user directory. One row per user. Links internal product users
      to HubSpot contacts and their parent account.
    meta:
      label: "Users"
      group_label: "Core"
    columns:
      - name: global_user_id
        description: "Stable surrogate key for the user."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_users:
              type: count_distinct
              label: "Total Users"

      - name: email
        description: "User email address."
        tests: [not_null]
        meta:
          dimension:
            label: "Email"

      - name: account_id
        description: "FK to dim_accounts."
        tests: [not_null]
        meta:
          dimension:
            hidden: true

      - name: first_name
        description: "User first name."
        meta:
          dimension:
            label: "First Name"

      - name: last_name
        description: "User last name."
        meta:
          dimension:
            label: "Last Name"

      - name: job_title
        description: "Job title as provided in the product."
        meta:
          dimension:
            label: "Job Title"

      - name: user_role
        description: "Application role (admin, member, viewer)."
        meta:
          dimension:
            label: "Role"

      - name: is_activated
        description: "Whether the user has completed the activation milestone."
        meta:
          dimension:
            label: "Activated"
            type: boolean
          metrics:
            activated_users:
              type: count_distinct
              sql: "${global_user_id}"
              label: "Activated Users"
              filters:
                - field: is_activated
                  operator: "is"
                  value: "true"

      - name: is_active_last_30d
        description: "Whether the user was seen in the last 30 days."
        meta:
          dimension:
            label: "Active (30d)"
            type: boolean
          metrics:
            active_users_30d:
              type: count_distinct
              sql: "${global_user_id}"
              label: "Active Users (30d)"
              filters:
                - field: is_active_last_30d
                  operator: "is"
                  value: "true"

      - name: created_at
        description: "User signup timestamp."
        meta:
          dimension:
            label: "Signed Up"
            type: timestamp

      - name: last_seen_at
        description: "Last product login timestamp."
        meta:
          dimension:
            label: "Last Seen"
            type: timestamp
