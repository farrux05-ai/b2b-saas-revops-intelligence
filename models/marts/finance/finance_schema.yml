version: 2

# =============================================================================
# SEMANTIC LAYER: Finance Domain
#
# Revenue metrics: MRR Waterfall, Subscriptions, ARR Movements.
# All monetary values in USD cents → converted to dollars in staging.
# =============================================================================

models:
  # ─── fct_mrr_waterfall ─────────────────────────────────────────────────────
  - name: fct_mrr_waterfall
    description: >
      Monthly MRR movements per account. Uses a date spine + LAG window to
      classify every account-month as: new, expansion, contraction, churn,
      resurrection, or retained. The canonical source for SaaS revenue trends.
    meta:
      label: "MRR Waterfall"
      group_label: "Finance"
    columns:
      - name: account_id
        description: "FK to dim_accounts."
        tests: [not_null]
        meta:
          dimension:
            hidden: true

      - name: workspace_name
        description: "Account workspace name for display."
        meta:
          dimension:
            label: "Account"

      - name: month_date
        description: "First day of the calendar month."
        tests: [not_null]
        meta:
          dimension:
            label: "Month"
            type: date

      - name: mrr
        description: "MRR at the end of this month (excludes past_due/unpaid)."
        tests:
          - not_null
          # MRR hech qachon manfiy bo'lmasligi kerak — billing bug signali
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
        meta:
          dimension:
            hidden: true
          metrics:
            total_mrr:
              type: sum
              label: "Total MRR"
              description: "Sum of MRR for the selected period."
              format: "usd"

      - name: at_risk_mrr
        description: "MRR from subscriptions in past_due status (unpaid/at risk)."
        meta:
          dimension:
            hidden: true
          metrics:
            total_at_risk_mrr:
              type: sum
              label: "Total At-Risk MRR"
              description: "Sum of unpaid MRR from past_due accounts."
              format: "usd"

      - name: previous_month_mrr
        description: "MRR from the prior month (via LAG)."
        meta:
          dimension:
            hidden: true

      - name: mrr_change_amount
        description: "Dollar change in MRR from prior month."
        meta:
          dimension:
            hidden: true
          metrics:
            net_mrr_change:
              type: sum
              label: "Net MRR Change"
              description: "Net expansion minus contraction minus churn."
              format: "usd"

      - name: mrr_movement_type
        description: "Movement classification: new, expansion, contraction, churn, resurrection, retained."
        tests:
          - accepted_values:
              values: ['new', 'expansion', 'contraction', 'churn', 'resurrection', 'retained']
        meta:
          dimension:
            label: "Movement Type"

    tests:
      # account_id + month_date must be unique — each account has one row per month
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['account_id', 'month_date']

  # ─── fct_subscriptions ─────────────────────────────────────────────────────
  - name: fct_subscriptions
    description: >
      Active subscription snapshot. One row per Stripe subscription.
      Finance source of truth for plan mix, MRR/ARR, and churn intent signals.
    meta:
      label: "Subscriptions"
      group_label: "Finance"
    columns:
      - name: subscription_id
        description: "Stripe subscription ID."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            total_subscriptions:
              type: count_distinct
              label: "Total Subscriptions"

      - name: mrr_amount
        description: "Monthly recurring revenue for this subscription."
        tests: [not_null]
        meta:
          dimension:
            hidden: true
          metrics:
            subscription_mrr:
              type: sum
              label: "Subscription MRR"
              format: "usd"

      - name: subscription_status
        description: "Stripe status: active, trialing, past_due, canceled, etc."
        tests:
          - accepted_values:
              values: ['active', 'trialing', 'past_due', 'canceled', 'incomplete', 'incomplete_expired', 'unpaid']
        meta:
          dimension:
            label: "Status"

  # ─── fct_arr_movements ─────────────────────────────────────────────────────
  - name: fct_arr_movements
    description: >
      Annualized revenue movements derived from the MRR waterfall.
      Each row represents one account-month with ARR-level aggregation.
    meta:
      label: "ARR Movements"
      group_label: "Finance"
    columns:
      - name: arr_snapshot_id
        description: "Surrogate key for the ARR snapshot (account_id + month_date)."
        tests: [unique, not_null]
        meta:
          dimension:
            hidden: true

      - name: account_id
        description: "FK to dim_accounts."
        tests: [not_null]
        meta:
          dimension:
            hidden: true

      - name: month_date
        description: "First day of the calendar month. Time axis for ARR trend analysis."
        tests: [not_null]
        meta:
          dimension:
            label: "Month"
            type: date

      - name: arr_movement_type
        description: "Movement classification mirroring MRR waterfall: new, expansion, contraction, churn, resurrection, retained."
        tests:
          - accepted_values:
              values: ['new', 'expansion', 'contraction', 'churn', 'resurrection', 'retained']
        meta:
          dimension:
            label: "ARR Movement Type"

      - name: previous_arr
        description: "ARR from the prior month (previous_month_mrr × 12)."
        meta:
          dimension:
            hidden: true

      - name: arr_amount
        description: "ARR change from prior month (mrr_change_amount × 12)."
        meta:
          dimension:
            hidden: true
          metrics:
            net_arr_change:
              type: sum
              label: "Net ARR Change"
              description: "Net ARR expansion minus contraction minus churn."
              format: "usd"

      - name: current_arr
        description: "Current annualized recurring revenue (mrr × 12)."
        meta:
          dimension:
            hidden: true
          metrics:
            total_arr_movements:
              type: sum
              label: "Total ARR (Movements)"
              description: "Sum of ARR from the movements table. Use for waterfall charts."
              format: "usd"

  # ─── fct_subscriptions (seat utilization additions) ─────────────────────────
  # NOTE: seat_utilization_pct, is_upsell_candidate, is_downsell_risk
  #       were added to fct_subscriptions. Add meta here when used in BI.

  # ─── fct_retention_cohorts ──────────────────────────────────────────────────
  - name: fct_retention_cohorts
    description: >
      Monthly NRR (Net Revenue Retention) and GRR (Gross Revenue Retention)
      cohort analysis. The #1 investor metric for B2B SaaS companies.
      NRR > 100% means customers are growing faster than they churn.
      GRR measures retention before any upsell/expansion (ceiling = 100%).
    meta:
      label: "Retention Cohorts"
      group_label: "Finance"
    columns:
      - name: month_date
        description: "First day of the calendar month."
        tests: [not_null]
        meta:
          dimension:
            label: "Month"
            type: date

      - name: nrr_pct
        description: "Net Revenue Retention %. >100% means expansion > churn. Best-in-class SaaS = 120%+."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_nrr:
              type: average
              label: "Avg NRR (%)"
              description: "Average Net Revenue Retention over selected period."
              round: 1

      - name: grr_pct
        description: "Gross Revenue Retention %. Excludes expansion. Healthy SaaS > 85%."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_grr:
              type: average
              label: "Avg GRR (%)"
              round: 1

      - name: monthly_churn_rate_pct
        description: "Churned MRR / Starting MRR for the month."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_churn_rate:
              type: average
              label: "Avg Monthly Churn Rate (%)"
              round: 2

      - name: logo_churn_rate_pct
        description: "Account count churn rate (not revenue-weighted)."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_logo_churn:
              type: average
              label: "Avg Logo Churn Rate (%)"
              round: 2

      - name: churned_mrr
        description: "MRR lost to churn this month."
        meta:
          dimension:
            hidden: true
          metrics:
            total_churned_mrr:
              type: sum
              label: "Total Churned MRR"
              format: "usd"

      - name: expansion_mrr
        description: "Additional MRR from existing accounts paying more."
        meta:
          dimension:
            hidden: true
          metrics:
            total_expansion_mrr:
              type: sum
              label: "Total Expansion MRR"
              format: "usd"

      - name: new_mrr
        description: "MRR from brand-new accounts."
        meta:
          dimension:
            hidden: true
          metrics:
            total_new_mrr:
              type: sum
              label: "Total New MRR"
              format: "usd"

      - name: ending_mrr
        description: "Total MRR at end of the month."
        meta:
          dimension:
            hidden: true
          metrics:
            total_ending_mrr:
              type: sum
              label: "Ending MRR"
              format: "usd"

  # ─── fct_unit_economics ─────────────────────────────────────────────────────
  - name: fct_unit_economics
    description: >
      LTV (Lifetime Value) estimates per account segment. Uses cohort-based
      churn rate to estimate LTV = Avg MRR / Monthly Churn Rate.
      LTV:ARR Ratio > 3x is a healthy SaaS benchmark.
      NOTE: CAC not included — no marketing spend data available.
    meta:
      label: "Unit Economics"
      group_label: "Finance"
    columns:
      - name: account_segment
        description: "Account revenue segment: Enterprise, Mid-Market, SMB, Trial/Free."
        meta:
          dimension:
            label: "Segment"

      - name: estimated_ltv
        description: "Estimated LTV in USD (Avg MRR / Monthly Churn Rate)."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_ltv:
              type: average
              label: "Avg Estimated LTV"
              format: "usd"

      - name: ltv_arr_ratio
        description: "LTV divided by ARR per account. Healthy SaaS target: > 3x."
        meta:
          dimension:
            hidden: true
          metrics:
            avg_ltv_arr_ratio:
              type: average
              label: "Avg LTV:ARR Ratio"
              round: 2

      - name: avg_nrr_pct
        description: "Portfolio average NRR over last 3 months."
        meta:
          dimension:
            label: "Avg NRR (%)"

      - name: avg_grr_pct
        description: "Portfolio average GRR over last 3 months."
        meta:
          dimension:
            label: "Avg GRR (%)"

      - name: total_segment_mrr
        description: "Total active MRR for this segment."
        meta:
          dimension:
            hidden: true
          metrics:
            segment_mrr:
              type: sum
              label: "Segment MRR"
              format: "usd"

      - name: pct_of_total_mrr
        description: "This segment's share of total portfolio MRR."
        meta:
          dimension:
            label: "MRR Share (%)"
