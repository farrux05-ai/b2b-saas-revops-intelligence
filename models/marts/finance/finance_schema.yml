version: 2

models:
  - name: fct_mrr_waterfall
    description: >
      Monthly MRR movements per account using a date spine + LAG window function.
      Classifies every account-month as: new, expansion, contraction, churn,
      resurrection, or retained.
    columns:
      - name: account_id
        tests: [not_null]
      - name: month_date
        tests: [not_null]
      - name: mrr
        tests: [not_null]
      - name: mrr_movement_type
        tests:
          - accepted_values:
              values: ['new', 'expansion', 'contraction', 'churn', 'resurrection', 'retained']

  - name: fct_subscriptions
    description: >
      Active subscription snapshot. One row per Stripe subscription.
      Finance source of truth for plan mix, MRR/ARR, and churn intent signals.
    columns:
      - name: subscription_id
        tests: [unique, not_null]
      - name: mrr_amount
        tests: [not_null]
      - name: subscription_status
        tests:
          - accepted_values:
              values: ['active', 'trialing', 'past_due', 'canceled', 'incomplete', 'incomplete_expired', 'unpaid']

  - name: fct_arr_movements
    description: "Annualized revenue movements derived from the MRR waterfall."
    columns:
      - name: arr_snapshot_id
        tests: [unique, not_null]
      - name: account_id
        tests: [not_null]
