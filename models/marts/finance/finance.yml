version: 2

# =============================================================================
# MART SCHEMA: Finance
# fct_mrr_waterfall, fct_retention_cohorts, fct_subscriptions,
# fct_unit_economics, fct_arr_movements
#
# Key fixes:
#   - config.meta syntax (dbt 1.10+)
#   - primary_key har bir modelda belgilangan
#   - groups: sidebar navigation
#   - default_filters: trailing 12 months (fct_mrr_waterfall, fct_retention_cohorts)
#   - spotlight categories: metrics catalog
# =============================================================================

models:

  # ─── fct_mrr_waterfall ─────────────────────────────────────────────────────
  - name: fct_mrr_waterfall
    description: "Monthly SaaS MRR Waterfall. Grain: account_id × month_date."
    config:
      meta:
        label: "SaaS MRR Waterfall"
        primary_key: waterfall_id
        groups: ['finance']
        order_fields_by: 'index'
        # DEFAULT FILTER: faqat so'nggi 12 oyni ko'rsatadi (performance)
        default_filters:
          - month_date: 'inThePast 12 months'
            required: false

    columns:
      - name: waterfall_id
        config:
          meta:
            label: "Waterfall Record ID"
            hidden: true

      - name: account_id
        config:
          meta:
            label: "Account ID"

      - name: workspace_name
        config:
          meta:
            label: "Workspace"

      - name: company_name
        config:
          meta:
            label: "Company"

      - name: month_date
        config:
          meta:
            label: "Month"
            dimension:
              type: date
              time_intervals: ['MONTH', 'QUARTER', 'YEAR']

      - name: mrr_movement_type
        config:
          meta:
            label: "Movement Type"
            # hint: new | expansion | contraction | churn | resurrection | retained

      - name: mrr
        config:
          meta:
            format: "usd"
            label: "End-of-Month MRR"
            metrics:
              total_waterfall_mrr:
                type: sum
                label: "Total MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'executive']

      - name: at_risk_mrr
        config:
          meta:
            format: "usd"
            label: "At-Risk MRR"
            metrics:
              waterfall_at_risk_mrr:
                type: sum
                label: "At-Risk MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'customer_success']

      - name: previous_month_mrr
        config:
          meta:
            format: "usd"
            label: "Previous Month MRR"
            metrics:
              total_previous_mrr:
                type: sum
                label: "Previous Month MRR ($)"
                format: "usd"

      - name: mrr_change_amount
        config:
          meta:
            format: "usd"
            label: "MRR Change Amount"
            metrics:
              total_mrr_change:
                type: sum
                label: "Net MRR Change ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']


  # ─── fct_retention_cohorts ─────────────────────────────────────────────────
  - name: fct_retention_cohorts
    description: "Monthly NRR / GRR Cohort Analysis. Grain: month_date (portfolio level)."
    config:
      meta:
        label: "NRR & GRR Retention Cohorts"
        primary_key: month_date
        groups: ['finance']
        order_fields_by: 'index'
        default_filters:
          - month_date: 'inThePast 12 months'
            required: false

    columns:
      - name: month_date
        config:
          meta:
            label: "Cohort Month"
            dimension:
              type: date
              time_intervals: ['MONTH', 'QUARTER', 'YEAR']

      - name: starting_mrr
        config:
          meta:
            format: "usd"
            label: "Starting MRR"
            metrics:
              sum_starting_mrr:
                type: sum
                label: "Total Starting MRR ($)"
                format: "usd"

      - name: new_mrr
        config:
          meta:
            format: "usd"
            label: "New MRR"
            metrics:
              sum_new_mrr:
                type: sum
                label: "New MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'executive']

      - name: expansion_mrr
        config:
          meta:
            format: "usd"
            label: "Expansion MRR"
            metrics:
              sum_expansion_mrr:
                type: sum
                label: "Expansion MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: contraction_mrr
        config:
          meta:
            format: "usd"
            label: "Contraction MRR"
            metrics:
              sum_contraction_mrr:
                type: sum
                label: "Contraction MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: churned_mrr
        config:
          meta:
            format: "usd"
            label: "Churned MRR"
            metrics:
              sum_churned_mrr:
                type: sum
                label: "Churned MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'customer_success']

      - name: resurrection_mrr
        config:
          meta:
            format: "usd"
            label: "Resurrection MRR"
            metrics:
              sum_resurrection_mrr:
                type: sum
                label: "Resurrection MRR ($)"
                format: "usd"

      - name: ending_mrr
        config:
          meta:
            format: "usd"
            label: "Ending MRR"
            metrics:
              sum_ending_mrr:
                type: sum
                label: "Ending MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: net_mrr_change
        config:
          meta:
            format: "usd"
            label: "Net MRR Change"
            metrics:
              sum_net_mrr_change:
                type: sum
                label: "Net MRR Change ($)"
                format: "usd"

      - name: starting_accounts
        config:
          meta:
            label: "Starting Accounts"
            metrics:
              sum_starting_accounts:
                type: sum
                label: "Starting Accounts"

      - name: ending_accounts
        config:
          meta:
            label: "Ending Accounts"
            metrics:
              sum_ending_accounts:
                type: sum
                label: "Ending Accounts"

      - name: churned_accounts
        config:
          meta:
            label: "Churned Accounts"
            metrics:
              sum_churned_accounts:
                type: sum
                label: "Churned Accounts"

      - name: grr_pct
        config:
          meta:
            # FIX: format: "percent" — lekin bu DIMENSION emas, bu calculated column.
            # Lightdash'da bu column'ni metric sifatida e'lon qilish to'g'riroq.
            # average metric: har oylik GRR % ni o'rtachasi
            format: "percent"
            label: "GRR %"
            metrics:
              avg_grr:
                type: average
                label: "Avg GRR (%)"
                format: "percent"
                spotlight:
                  categories: ['finance', 'executive']

      - name: nrr_pct
        config:
          meta:
            format: "percent"
            label: "NRR %"
            metrics:
              avg_nrr:
                type: average
                label: "Avg NRR (%)"
                format: "percent"
                spotlight:
                  categories: ['finance', 'executive']

      - name: monthly_churn_rate_pct
        config:
          meta:
            format: "percent"
            label: "Monthly Churn Rate %"
            metrics:
              avg_monthly_churn_rate:
                type: average
                label: "Avg Monthly Churn Rate (%)"
                format: "percent"
                spotlight:
                  categories: ['finance', 'executive']

      - name: logo_churn_rate_pct
        config:
          meta:
            format: "percent"
            label: "Logo Churn Rate %"
            metrics:
              avg_logo_churn_rate:
                type: average
                label: "Avg Logo Churn Rate (%)"
                format: "percent"
                spotlight:
                  categories: ['finance']


  # ─── fct_subscriptions ─────────────────────────────────────────────────────
  - name: fct_subscriptions
    description: "Active Subscription Snapshot. Grain: workspace_id."
    config:
      meta:
        label: "Active Subscriptions"
        primary_key: workspace_id
        groups: ['finance']
        order_fields_by: 'index'

    columns:
      - name: workspace_id
        config:
          meta:
            label: "Workspace ID"
            metrics:
              total_subscriptions:
                type: count_distinct
                label: "Total Subscriptions"

      - name: account_id
        config:
          meta:
            label: "Account ID"

      - name: workspace_name
        config:
          meta:
            label: "Workspace"

      - name: company_name
        config:
          meta:
            label: "Company"

      - name: subscription_status
        config:
          meta:
            label: "Subscription Status"

      - name: plan_id
        config:
          meta:
            label: "Plan"

      - name: mrr_amount
        config:
          meta:
            format: "usd"
            label: "MRR Amount"
            metrics:
              total_active_mrr:
                type: sum
                label: "Total Active MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']
              avg_active_mrr:
                type: average
                label: "Average MRR per Account ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: arr_amount
        config:
          meta:
            format: "usd"
            label: "ARR Amount"
            metrics:
              total_active_arr:
                type: sum
                label: "Total Active ARR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'executive']

      - name: seats_purchased
        config:
          meta:
            label: "Seats Purchased"
            metrics:
              total_seats_purchased:
                type: sum
                label: "Total Seats Purchased"

      - name: seats_used
        config:
          meta:
            label: "Seats Used"
            metrics:
              total_seats_used:
                type: sum
                label: "Total Seats Used"

      - name: seat_utilization_pct
        config:
          meta:
            format: "percent"
            label: "Seat Utilization %"
            metrics:
              avg_seat_utilization_pct:
                type: average
                label: "Avg Seat Utilization (%)"
                format: "percent"

      - name: is_active
        config:
          meta:
            label: "Is Active?"

      - name: is_trialing
        config:
          meta:
            label: "Is Trialing?"

      - name: is_past_due
        config:
          meta:
            label: "Is Past Due?"

      - name: is_canceled
        config:
          meta:
            label: "Is Canceled?"

      - name: is_churning_soon
        config:
          meta:
            label: "Churning Soon?"

      - name: current_period_start_at
        config:
          meta:
            label: "Period Start"
            dimension:
              type: timestamp
              time_intervals: ['DAY', 'MONTH']

      - name: current_period_end_at
        config:
          meta:
            label: "Period End"
            dimension:
              type: timestamp
              time_intervals: ['DAY', 'MONTH']


  # ─── fct_unit_economics ────────────────────────────────────────────────────
  - name: fct_unit_economics
    description: "Unit Economics & LTV. Grain: account_segment."
    config:
      meta:
        label: "Unit Economics & LTV"
        primary_key: account_segment
        groups: ['finance']
        order_fields_by: 'index'

    columns:
      - name: account_segment
        config:
          meta:
            label: "Account Segment"

      - name: active_accounts
        config:
          meta:
            label: "Active Accounts"
            metrics:
              total_active_accounts_sum:
                type: sum
                label: "Total Active Accounts"
                spotlight:
                  categories: ['executive']

      - name: total_segment_mrr
        config:
          meta:
            format: "usd"
            label: "Total Segment MRR"
            metrics:
              sum_segment_mrr:
                type: sum
                label: "Total Segment MRR ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: avg_mrr_per_account
        config:
          meta:
            format: "usd"
            label: "Avg MRR per Account"
            metrics:
              average_mrr_per_account:
                type: average
                label: "Avg MRR per Account ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: estimated_ltv
        config:
          meta:
            format: "usd"
            label: "Estimated LTV"
            metrics:
              avg_estimated_ltv:
                type: average
                label: "Avg Estimated LTV ($)"
                format: "usd"
                spotlight:
                  categories: ['finance', 'executive']

      - name: avg_arr_per_account
        config:
          meta:
            format: "usd"
            label: "Avg ARR per Account"
            metrics:
              average_arr_per_account:
                type: average
                label: "Avg ARR per Account ($)"
                format: "usd"
                spotlight:
                  categories: ['finance']

      - name: ltv_arr_ratio
        config:
          meta:
            label: "LTV:ARR Ratio"
            metrics:
              avg_ltv_arr_ratio:
                type: average
                label: "Avg LTV:ARR Ratio"
                spotlight:
                  categories: ['finance', 'executive']

      - name: avg_monthly_churn_rate_pct
        config:
          meta:
            format: "percent"
            label: "Avg Monthly Churn Rate %"
            metrics:
              unit_econ_avg_churn_rate:
                type: average
                label: "Avg Churn Rate (%)"
                format: "percent"

      - name: avg_nrr_pct
        config:
          meta:
            format: "percent"
            label: "Avg NRR %"
            metrics:
              unit_econ_avg_nrr:
                type: average
                label: "Avg NRR (%)"
                format: "percent"

      - name: pct_of_total_mrr
        config:
          meta:
            format: "percent"
            label: "% of Total MRR"
            metrics:
              sum_pct_of_total_mrr:
                type: sum
                label: "% of Total MRR"
                format: "percent"