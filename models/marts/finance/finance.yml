version: 2
models:
- name: fct_subscriptions
  description: 'Active Subscription Snapshot Mart. One row per workspace subscription.
    Sourced from int_billing_aggregated.

    '
  config:
    meta:
      label: Active Subscriptions
  columns:
  - name: workspace_id
    description: Grain. Workspace ID.
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Workspace ID
  - name: account_id
    description: FK to dim_accounts.
    config:
      meta:
        label: Account ID
  - name: mrr_amount
    description: Workspace active MRR in USD.
    tests:
    - not_null
    config:
      meta:
        format: usd
        label: MRR Amount
  - name: subscription_status
    tests:
    - accepted_values:
        arguments:
          values:
          - active
          - trialing
          - past_due
          - canceled
          - incomplete
          - incomplete_expired
          - unpaid
    config:
      meta:
        label: Subscription Status
- name: fct_mrr_waterfall
  description: 'Monthly SaaS MRR Waterfall Movements. Grain: account_id x month_date.
    Sourced from int_billing_aggregated.

    '
  config:
    meta:
      label: SaaS MRR Waterfall
  columns:
  - name: waterfall_id
    description: Grain. account_id x month_date surrogate key.
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Waterfall Record ID
  - name: account_id
    description: FK to dim_accounts.
    config:
      meta:
        label: Account ID
  - name: mrr
    description: End of month MRR.
    tests:
    - not_null
    config:
      meta:
        format: usd
        label: End of Month MRR
  - name: mrr_movement_type
    tests:
    - accepted_values:
        arguments:
          values:
          - new
          - expansion
          - contraction
          - churn
          - resurrection
          - retained
    config:
      meta:
        label: MRR Movement Type
- name: fct_arr_movements
  description: Annualized ARR movements derived from fct_mrr_waterfall (* 12).
  config:
    meta:
      label: ARR Waterfall Movements
  columns:
  - name: arr_snapshot_id
    tests:
    - unique
    - not_null
    config:
      meta:
        label: ARR Snapshot ID
  - name: account_id
    description: FK to dim_accounts.
    config:
      meta:
        label: Account ID
  - name: arr_movement_type
    tests:
    - accepted_values:
        arguments:
          values:
          - new
          - expansion
          - contraction
          - churn
          - resurrection
          - retained
    config:
      meta:
        label: ARR Movement Type
  - name: month_date
    config:
      meta:
        label: Month Date
  - name: previous_arr
    config:
      meta:
        format: usd
        label: Previous ARR
        metrics:
          total_previous_arr:
            type: sum
            format: usd
            label: Total Previous ARR ($)
  - name: arr_amount
    config:
      meta:
        format: usd
        label: ARR Change Amount
        metrics:
          total_arr_change:
            type: sum
            format: usd
            label: Total ARR Change ($)
  - name: current_arr
    config:
      meta:
        format: usd
        label: Current ARR
        metrics:
          total_current_arr:
            type: sum
            format: usd
            label: Total Current ARR ($)
- name: fct_retention_cohorts
  description: 'Monthly NRR / GRR Cohort Analysis Mart. Grain: month_date (Portfolio
    aggregate). Sourced from fct_mrr_waterfall.

    '
  config:
    meta:
      label: NRR & GRR Retention Cohorts
  columns:
  - name: month_date
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Cohort Month
- name: fct_unit_economics
  description: 'Unit Economics & LTV Metrics Mart. Grain: account_segment. LTV = Avg
    MRR / Monthly Churn Rate.

    '
  config:
    meta:
      label: Unit Economics & LTV
  columns:
  - name: account_segment
    tests:
    - unique
    - not_null
    config:
      meta:
        label: Account Segment
