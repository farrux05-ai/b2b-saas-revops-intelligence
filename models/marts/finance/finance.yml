version: 2
models:
- name: fct_subscriptions
  description: Active Subscription Snapshot Mart. One row per workspace subscription.
  config:
    meta:
      label: Active Subscriptions
  columns:
  - name: workspace_id
    config:
      meta:
        label: Workspace ID
        metrics:
          total_subscriptions:
            type: count_distinct
            label: Total Subscriptions
  - name: account_id
    config:
      meta:
        label: Account ID
  - name: customer_id
    config:
      meta:
        label: Stripe Customer ID
  - name: workspace_name
    config:
      meta:
        label: Workspace Name
  - name: domain
    config:
      meta:
        label: Domain
  - name: subscription_status
    config:
      meta:
        label: Subscription Status
  - name: plan_id
    config:
      meta:
        label: Plan ID
  - name: mrr_amount
    config:
      meta:
        format: usd
        label: MRR Amount
        metrics:
          total_active_mrr:
            type: sum
            format: usd
            label: Total Active MRR ($)
          avg_active_mrr:
            type: average
            format: usd
            label: Average Active MRR ($)
  - name: arr_amount
    config:
      meta:
        format: usd
        label: ARR Amount
        metrics:
          total_active_arr:
            type: sum
            format: usd
            label: Total Active ARR ($)
  - name: seats_purchased
    config:
      meta:
        label: Seats Purchased
        metrics:
          total_seats_purchased:
            type: sum
            label: Total Seats Purchased
  - name: seats_used
    config:
      meta:
        label: Seats Used
        metrics:
          total_seats_used:
            type: sum
            label: Total Seats Used
  - name: seat_utilization_pct
    config:
      meta:
        format: percent
        label: Seat Utilization %
        metrics:
          avg_seat_utilization_pct:
            type: average
            format: percent
            label: Average Seat Utilization %
  - name: is_active
    config:
      meta:
        label: Is Active
  - name: is_trialing
    config:
      meta:
        label: Is Trialing
  - name: is_past_due
    config:
      meta:
        label: Is Past Due
  - name: is_canceled
    config:
      meta:
        label: Is Canceled
  - name: is_churning_soon
    config:
      meta:
        label: Is Churning Soon
  - name: company_name
    config:
      meta:
        label: Company Name
- name: fct_mrr_waterfall
  description: Monthly SaaS MRR Waterfall Movements.
  config:
    meta:
      label: SaaS MRR Waterfall
  columns:
  - name: waterfall_id
    config:
      meta:
        label: Waterfall Record ID
        metrics:
          total_waterfall_records:
            type: count_distinct
            label: Total Waterfall Records
  - name: account_id
    config:
      meta:
        label: Account ID
  - name: workspace_name
    config:
      meta:
        label: Workspace Name
  - name: month_date
    config:
      meta:
        label: Month Date
  - name: mrr
    config:
      meta:
        format: usd
        label: End of Month MRR
        metrics:
          total_waterfall_mrr:
            type: sum
            format: usd
            label: Total Waterfall MRR ($)
  - name: at_risk_mrr
    config:
      meta:
        format: usd
        label: At Risk MRR
        metrics:
          waterfall_at_risk_mrr:
            type: sum
            format: usd
            label: Waterfall At Risk MRR ($)
  - name: previous_month_mrr
    config:
      meta:
        format: usd
        label: Previous Month MRR
        metrics:
          total_previous_mrr:
            type: sum
            format: usd
            label: Total Previous Month MRR ($)
  - name: mrr_change_amount
    config:
      meta:
        format: usd
        label: MRR Change Amount
        metrics:
          total_mrr_change:
            type: sum
            format: usd
            label: Total MRR Change ($)
  - name: mrr_movement_type
    config:
      meta:
        label: MRR Movement Type
  - name: company_name
    config:
      meta:
        label: Company Name
- name: fct_arr_movements
  description: Annualized ARR movements.
  config:
    meta:
      label: ARR Waterfall Movements
  columns:
  - name: arr_snapshot_id
    config:
      meta:
        label: ARR Snapshot ID
        metrics:
          total_arr_records:
            type: count_distinct
            label: Total ARR Records
  - name: account_id
    config:
      meta:
        label: Account ID
  - name: arr_movement_type
    config:
      meta:
        label: ARR Movement Type
  - name: month_date
    config:
      meta:
        label: Month Date
  - name: previous_arr
    config:
      meta:
        format: usd
        label: Previous ARR
        metrics:
          total_previous_arr:
            type: sum
            format: usd
            label: Total Previous ARR ($)
  - name: arr_amount
    config:
      meta:
        format: usd
        label: ARR Change Amount
        metrics:
          total_arr_change:
            type: sum
            format: usd
            label: Total ARR Change ($)
  - name: current_arr
    config:
      meta:
        format: usd
        label: Current ARR
        metrics:
          total_current_arr:
            type: sum
            format: usd
            label: Total Current ARR ($)
  - name: company_name
    config:
      meta:
        label: Company Name
  - name: workspace_name
    config:
      meta:
        label: Workspace Name
- name: fct_retention_cohorts
  description: Monthly NRR / GRR Cohort Analysis Mart.
  config:
    meta:
      label: NRR & GRR Retention Cohorts
  columns:
  - name: month_date
    config:
      meta:
        label: Cohort Month
  - name: starting_mrr
    config:
      meta:
        format: usd
        label: Starting MRR
        metrics:
          sum_starting_mrr:
            type: sum
            format: usd
            label: Total Starting MRR ($)
  - name: new_mrr
    config:
      meta:
        format: usd
        label: New MRR
        metrics:
          sum_new_mrr:
            type: sum
            format: usd
            label: Total New MRR ($)
  - name: expansion_mrr
    config:
      meta:
        format: usd
        label: Expansion MRR
        metrics:
          sum_expansion_mrr:
            type: sum
            format: usd
            label: Total Expansion MRR ($)
  - name: contraction_mrr
    config:
      meta:
        format: usd
        label: Contraction MRR
        metrics:
          sum_contraction_mrr:
            type: sum
            format: usd
            label: Total Contraction MRR ($)
  - name: churned_mrr
    config:
      meta:
        format: usd
        label: Churned MRR
        metrics:
          sum_churned_mrr:
            type: sum
            format: usd
            label: Total Churned MRR ($)
  - name: resurrection_mrr
    config:
      meta:
        format: usd
        label: Resurrection MRR
        metrics:
          sum_resurrection_mrr:
            type: sum
            format: usd
            label: Total Resurrection MRR ($)
  - name: ending_mrr
    config:
      meta:
        format: usd
        label: Ending MRR
        metrics:
          sum_ending_mrr:
            type: sum
            format: usd
            label: Total Ending MRR ($)
  - name: net_mrr_change
    config:
      meta:
        format: usd
        label: Net MRR Change
        metrics:
          sum_net_mrr_change:
            type: sum
            format: usd
            label: Total Net MRR Change ($)
  - name: starting_accounts
    config:
      meta:
        label: Starting Accounts
        metrics:
          sum_starting_accounts:
            type: sum
            label: Total Starting Accounts
  - name: ending_accounts
    config:
      meta:
        label: Ending Accounts
        metrics:
          sum_ending_accounts:
            type: sum
            label: Total Ending Accounts
  - name: churned_accounts
    config:
      meta:
        label: Churned Accounts
        metrics:
          sum_churned_accounts:
            type: sum
            label: Total Churned Accounts
  - name: grr_pct
    config:
      meta:
        format: percent
        label: GRR %
        metrics:
          avg_grr:
            type: average
            format: percent
            label: Average GRR (%)
  - name: nrr_pct
    config:
      meta:
        format: percent
        label: NRR %
        metrics:
          avg_nrr:
            type: average
            format: percent
            label: Average NRR (%)
  - name: monthly_churn_rate_pct
    config:
      meta:
        format: percent
        label: Monthly Churn Rate %
        metrics:
          avg_monthly_churn_rate:
            type: average
            format: percent
            label: Average Monthly Churn Rate (%)
  - name: logo_churn_rate_pct
    config:
      meta:
        format: percent
        label: Logo Churn Rate %
        metrics:
          avg_logo_churn_rate:
            type: average
            format: percent
            label: Average Logo Churn Rate (%)
- name: fct_unit_economics
  description: Unit Economics & LTV Metrics Mart.
  config:
    meta:
      label: Unit Economics & LTV
  columns:
  - name: account_segment
    config:
      meta:
        label: Account Segment
  - name: active_accounts
    config:
      meta:
        label: Active Accounts
        metrics:
          total_active_accounts_sum:
            type: sum
            label: Total Active Accounts
  - name: total_segment_mrr
    config:
      meta:
        format: usd
        label: Total Segment MRR
        metrics:
          sum_segment_mrr:
            type: sum
            format: usd
            label: Total Segment MRR ($)
  - name: avg_mrr_per_account
    config:
      meta:
        format: usd
        label: Avg MRR per Account
        metrics:
          average_mrr_per_account:
            type: average
            format: usd
            label: Average MRR per Account ($)
  - name: avg_monthly_churn_rate_pct
    config:
      meta:
        format: percent
        label: Avg Monthly Churn Rate %
        metrics:
          unit_econ_avg_churn_rate:
            type: average
            format: percent
            label: Unit Econ Avg Churn Rate (%)
  - name: avg_nrr_pct
    config:
      meta:
        format: percent
        label: Avg NRR %
        metrics:
          unit_econ_avg_nrr:
            type: average
            format: percent
            label: Unit Econ Avg NRR (%)
  - name: avg_grr_pct
    config:
      meta:
        format: percent
        label: Avg GRR %
        metrics:
          unit_econ_avg_grr:
            type: average
            format: percent
            label: Unit Econ Avg GRR (%)
  - name: estimated_ltv
    config:
      meta:
        format: usd
        label: Estimated LTV
        metrics:
          avg_estimated_ltv:
            type: average
            format: usd
            label: Average Estimated LTV ($)
  - name: avg_arr_per_account
    config:
      meta:
        format: usd
        label: Avg ARR per Account
        metrics:
          average_arr_per_account:
            type: average
            format: usd
            label: Average ARR per Account ($)
  - name: ltv_arr_ratio
    config:
      meta:
        label: 'LTV : ARR Ratio'
        metrics:
          avg_ltv_arr_ratio:
            type: average
            label: Average LTV:ARR Ratio
  - name: pct_of_total_mrr
    config:
      meta:
        format: percent
        label: '% of Total MRR'
        metrics:
          sum_pct_of_total_mrr:
            type: sum
            format: percent
            label: '% of Total MRR Sum'
