version: 2

# =============================================================================
# MetricFlow Time Spine Semantic Model
# =============================================================================

semantic_models:
  - name: metricflow_time_spine
    description: "Daily time spine for MetricFlow time-series metrics."
    model: ref('metricflow_time_spine')
    defaults:
      agg_time_dimension: date_day
    entities:
      - name: day_id
        type: primary
        expr: date_day
    dimensions:
      - name: date_day
        type: time
        type_params:
          time_granularity: day
