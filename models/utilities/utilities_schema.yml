version: 2

models:
  - name: dim_dates
    description: "Universal date dimension table for time-series analysis."
    meta:
      label: "Dates"
    columns:
      - name: date_day
        description: "The calendar date."
        meta:
          dimension:
            type: date
            time_intervals: ['DAY', 'WEEK', 'MONTH', 'QUARTER', 'YEAR']
      
      - name: year_month
        description: "The year and month (YYYY-MM)."
        meta:
          dimension:
            type: string
            
      - name: day_of_week_name
        description: "The name of the day of the week (e.g., Monday)."
        meta:
          dimension:
            type: string
            
      - name: is_weekend
        description: "Flag indicating if the date is a weekend."
        meta:
          dimension:
            type: boolean
            
      - name: is_holiday
        description: "Flag indicating if the date is a US public holiday."
        meta:
          dimension:
            type: boolean
