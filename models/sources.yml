version: 2

# ─────────────────────────────────────────────────────────────────────────────
# dbt Sources — Raw data loaded by ingestion/stackflow_pipeline.py (mock data)
#
# ALL tables land in one schema: REVOPS_INTELLIGENCE.RAW_DATA
# This is set by dataset_name="RAW_DATA" in ingestion/stackflow_pipeline.py.
#
# NOTE: b2b_dlt/ is a separate production-ready showcase (real API connectors).
#       It is NOT the source of truth for dbt models in this project.
#       dbt reads exclusively from the mock ingestion pipeline output below.
# ─────────────────────────────────────────────────────────────────────────────

sources:

  # ── HubSpot CRM ─────────────────────────────────────────────────────────────
  - name: hubspot
    database: REVOPS_INTELLIGENCE
    schema: raw_data
    description: "HubSpot CRM data — mock JSON loaded by ingestion/stackflow_pipeline.py"
    tables:
      - name: companies
        description: "HubSpot company records (125 mock companies)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 49, period: hour}
        columns:
          - name: hs_object_id
            tests: [unique, not_null]
          - name: domain
            tests: [not_null]
          - name: name
            tests: [not_null]
        tests:
          - elementary.volume_anomalies:
              arguments:
                time_bucket: {period: day, count: 1}

      - name: deals
        description: "HubSpot deal pipeline records (184 mock deals)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 49, period: hour}
        columns:
          - name: hs_object_id
            tests: [unique, not_null]

      - name: contacts
        description: "HubSpot contact records (438 mock contacts)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 49, period: hour}
        columns:
          - name: hs_object_id
            tests: [not_null]
        tests:
          - elementary.schema_changes

      - name: engagements
        description: "HubSpot engagement records (calls, emails, meetings)"
        columns:
          - name: hs_engagement_id
            tests: [unique, not_null]

  # ── Stripe Billing ──────────────────────────────────────────────────────────
  - name: stripe
    database: REVOPS_INTELLIGENCE
    schema: raw_data
    description: "Stripe billing data — mock JSON loaded by ingestion/stackflow_pipeline.py"
    tables:
      - name: subscriptions
        description: "Stripe subscription records per workspace"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 25, period: hour}
            error_after: {count: 49, period: hour}
        columns:
          - name: id
            tests: [unique, not_null]
          - name: metadata__workspace_id
            tests: [not_null]
        tests:
          - elementary.volume_anomalies:
              arguments:
                time_bucket: {period: day, count: 1}

      - name: invoices
        description: "Stripe invoice history"
        columns:
          - name: id
            tests: [unique, not_null]

      - name: payments
        description: "Stripe payment records"

  # ── Internal DB (PostgreSQL / mock) ─────────────────────────────────────────
  - name: internal
    database: REVOPS_INTELLIGENCE
    schema: raw_data
    description: "Internal application database — mock JSON loaded by ingestion/stackflow_pipeline.py"
    tables:
      - name: workspaces
        description: "Internal product workspaces (teams using StackFlow AI)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}
        columns:
          - name: id
            tests: [unique, not_null]
        tests:
          - elementary.volume_anomalies:
              arguments:
                time_bucket: {period: day, count: 1}

      - name: users
        description: "Internal product users"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}
        columns:
          - name: id
            tests: [unique, not_null]
          - name: email
            tests: [not_null]

      - name: events
        description: "Internal product usage events (~31K mock events: Git connect, Sprint, AI prioritization)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
        tests:
          - elementary.volume_anomalies:
              arguments:
                time_bucket: {period: hour, count: 1}

  # ── PostHog Product Telemetry ───────────────────────────────────────────────
  - name: posthog
    database: REVOPS_INTELLIGENCE
    schema: raw_data
    description: "PostHog product telemetry events — raw data in RAW_DATA.EVENTS"
    tables:
      - name: events
        identifier: events
        description: "Product telemetry events (git connect, sprint start, AI prioritization)"
        config:
          loaded_at_field: "_dlt_load_id"
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
        columns:
          - name: id
            tests: [unique, not_null]
        tests:
          - elementary.volume_anomalies:
              arguments:
                time_bucket: {period: hour, count: 1}

  # ── Zendesk Support ─────────────────────────────────────────────────────────
  - name: zendesk
    database: REVOPS_INTELLIGENCE
    schema: raw_data
    description: "Zendesk support tickets — mock JSON loaded by ingestion/stackflow_pipeline.py"
    tables:
      - name: tickets
        description: "Support tickets linked to workspaces"
        config:
          loaded_at_field: "updated_at"
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: id
            tests: [not_null]
          - name: requester_email
            tests: [not_null]
        tests:
          - elementary.schema_changes