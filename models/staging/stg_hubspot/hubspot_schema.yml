version: 2

models:
  - name: stg_hubspot__companies
    description: >
      Cleaned and deduplicated HubSpot company records.
      One row per company.
    columns:
      - name: hubspot_company_id
        description: "HubSpot native company ID"
        tests: [unique, not_null]
      - name: domain
        description: "Identity stitching uchun asosiy kalit"
        tests:
          - not_null
          - unique
      - name: company_name
        tests: [not_null]
      - name: lifecycle_stage
        tests:
          - accepted_values:
              values: ['subscriber', 'lead', 'marketingqualifiedlead', 'salesqualifiedlead',
                       'opportunity', 'customer', 'evangelist', 'other']
      - name: lead_status
        tests:
          - accepted_values:
              values: ['new', 'open', 'in_progress', 'attempted_to_contact',
                       'connected', 'bad_timing', 'unqualified']

  - name: stg_hubspot__deals
    description: >
      Cleaned HubSpot deal records. One row per deal (latest version after dedup).
    columns:
      - name: hubspot_deal_id
        tests: [unique, not_null]
      - name: hubspot_company_id
        tests: [not_null]
      - name: deal_stage
        tests: [not_null]
      - name: amount
        description: "Bitim summasi USD da"
        tests: [not_null]
      - name: probability
        tests:
          - not_null

  - name: stg_hubspot__contacts
    description: >
      Cleaned HubSpot contact records. One row per contact.
    columns:
      - name: hubspot_contact_id
        tests: [unique, not_null]
      - name: hubspot_company_id
        tests: [not_null]
      - name: email
        tests:
          - not_null
          - unique
      - name: lead_status
        tests:
          - accepted_values:
              values: ['new', 'open', 'in_progress', 'attempted_to_contact',
                       'connected', 'bad_timing', 'unqualified']