version: 2

# =============================================================================
# STAGING TESTING PHILOSOPHY:
# Test the CONTRACT with the source system.
# Staging tests answer: "Did the source deliver what it promised?"
#
# Rules:
#   1. ALWAYS test: unique + not_null on the natural Primary Key
#   2. ONLY test accepted_values for fields we control via enum/picklist (CRM statuses)
#   3. NEVER test business-derived metrics (amounts, counts) — that's Mart territory
#   4. NEVER duplicate tests that will be re-tested downstream
# =============================================================================

models:
  - name: stg_hubspot__companies
    description: >
      Cleaned HubSpot company records. One row per company (source dedup by ELT tool).
    columns:
      - name: hubspot_company_id
        description: "Natural PK from HubSpot."
        tests: [unique, not_null]
      - name: domain
        description: "Primary identity stitching key. Unique per company in HubSpot."
        tests: [not_null]
      - name: company_name
        description: "Company display name."
      - name: industry
        description: "Industry category."
      - name: employee_count
        description: "Reported company employee count."
      - name: lifecycle_stage
        description: "HubSpot-managed enum. Tested here because we own the allowed values."
        tests:
          - accepted_values:
              values: ['subscriber', 'lead', 'marketingqualifiedlead', 'salesqualifiedlead',
                       'opportunity', 'customer', 'evangelist', 'other']
      - name: lead_status
        description: "CRM lead status enum."
        tests:
          - accepted_values:
              values: ['NEW', 'OPEN', 'IN_PROGRESS', 'ATTEMPTED_TO_CONTACT',
                       'CONNECTED', 'BAD_TIMING', 'UNQUALIFIED']
      - name: owner_id
        description: "HubSpot user ID who owns this company."
      - name: utm_source
        description: "First-touch attribution source (e.g. Organic Search, Google Ads). May be stale."
      - name: utm_campaign
        description: "Specific campaign parameter."
      - name: created_at
        description: "Record creation timestamp."
      - name: updated_at
        description: "Last modification timestamp."

  - name: stg_hubspot__contacts
    description: >
      Cleaned HubSpot contact records. One row per contact.
    columns:
      - name: hubspot_contact_id
        description: "Natural PK from HubSpot contacts."
        tests: [unique, not_null]
      - name: hubspot_company_id
        description: "Foreign key to stg_hubspot__companies."
      - name: first_name
        description: "Contact first name."
      - name: last_name
        description: "Contact last name."
      - name: email
        description: "Used for identity stitching to internal users. Not guaranteed unique by HubSpot."
        tests: [not_null]
      - name: normalized_email
        description: "Lowercased and trimmed email for clean identity resolution."
      - name: job_title
        description: "Contact job title."
      - name: lead_status
        description: "CRM lead stage status."
      - name: linkedin_profile_url
        description: "Enriched LinkedIn URL."
      - name: is_gtm_enriched
        description: "Flag indicating whether record was enriched via Clay / GTM workflow."
      - name: created_at
        description: "Contact creation timestamp."
      - name: updated_at
        description: "Last update timestamp."

  - name: stg_hubspot__deals
    description: >
      Cleaned HubSpot deal records. One row per deal.
    columns:
      - name: hubspot_deal_id
        description: "Natural PK from HubSpot deals."
        tests: [unique, not_null]
      - name: hubspot_company_id
        description: "FK to stg_hubspot__companies. Can be null for deals not linked to a company."
      - name: deal_name
        description: "Name of the deal opportunity."
      - name: pipeline
        description: "Sales pipeline identifier."
      - name: deal_stage
        description: "Current pipeline stage. not_null contract with HubSpot."
        tests: [not_null]
      - name: amount
        description: "Deal value amount in USD."
      - name: probability
        description: "Win probability percentage (0.0 to 1.0)."
      - name: created_at
        description: "Deal creation timestamp."
      - name: closed_at
        description: "Deal closure timestamp."

  - name: stg_hubspot__engagements
    description: "Cleaned HubSpot engagement records (calls, emails, meetings). One row per engagement."
    columns:
      - name: hubspot_engagement_id
        description: "Natural PK from HubSpot engagements."
        tests: [unique, not_null]
      - name: hubspot_company_id
        description: "Foreign key to stg_hubspot__companies."
      - name: owner_id
        description: "Owner user ID performing engagement."
      - name: engagement_type
        description: "Type of interaction (CALL, EMAIL, MEETING)."
        tests:
          - accepted_values:
              values: ['CALL', 'EMAIL', 'MEETING']
      - name: created_at
        description: "Engagement creation timestamp."