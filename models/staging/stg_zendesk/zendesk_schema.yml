version: 2

models:
  - name: stg_zendesk__tickets
    description: >
      Cleaned Zendesk support tickets.
    columns:
      - name: ticket_id
        tests: [unique, not_null]
      - name: requester_email
        tests: [not_null]
      - name: ticket_status
        tests: [not_null]
      - name: priority
        tests: [not_null]