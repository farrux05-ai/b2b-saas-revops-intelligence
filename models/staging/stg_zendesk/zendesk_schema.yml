version: 2

# STAGING PHILOSOPHY: Test source CONTRACT only.
# Zendesk always delivers ticket_id and status.

models:
  - name: stg_zendesk__tickets
    description: "Cleaned Zendesk support tickets. One row per ticket."
    columns:
      - name: ticket_id
        description: "Natural PK from Zendesk tickets."
        tests: [unique, not_null]
      - name: requester_email
        description: "Used to map tickets back to users/accounts."
        # Cannot be not_null: sometimes tickets are created via integrations without an email
      - name: ticket_status
        description: "Zendesk native status enum."
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'open', 'pending', 'hold', 'solved', 'closed', 'deleted']
      - name: priority
        description: "Zendesk native priority enum."
        tests:
          - accepted_values:
              values: ['urgent', 'high', 'normal', 'low']