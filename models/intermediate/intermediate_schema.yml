version: 2

# =============================================================================
# INTERMEDIATE LAYER — Schema and Test Assertions
#
# Testing Philosophy:
#   1_identity   -> Surrogate keys unique + not_null (identity integrity guarantee)
#   2_domains    -> Grain columns unique + not_null, critical FKs not_null
#   3_integration -> Primary account_id unique + not_null, business metrics not_null
#
# Rule: Business metric aggregations (total MRR, ticket counts) are NOT tested in INT
#       — that is the scope of Marts and integration tests.
# =============================================================================

models:

  # ===========================================================================
  # LAYER 1: Identity
  # ===========================================================================

  - name: int_accounts_joined
    description: >
      Global account identity spine. Combines internal product workspaces (primary),
      HubSpot CRM companies (enrichment), and CRM-only leads via UNION ALL.
      All downstream models join to this surrogate key.
    columns:
      - name: account_id
        description: >
          Stable surrogate key generated via coalesce(hubspot_company_id, internal_workspace_id).
          Primary anchor for all downstream joins.
        tests: [unique, not_null]

      - name: internal_workspace_id
        description: "FK to stg_internal__workspaces. NULL for CRM-only leads."

      - name: hubspot_company_id
        description: "FK to stg_hubspot__companies. Present for CRM records without workspaces."

      - name: domain
        description: "Company domain. Used for L2A (Lead-to-Account) fuzzy matching."

      - name: workspace_name
        description: "Display name. Defaults to workspace_name, falls back to HubSpot company_name."

  - name: int_users_joined
    description: >
      Global user identity spine. Links internal users to HubSpot contacts via email matching.
      L2A Fallback: Resolves account via email domain matching when direct workspace link is absent.
      Generic email domains (e.g., gmail.com) are filtered out via generic_domains seed.
    columns:
      - name: global_user_id
        description: >
          Stable surrogate key based on internal_user_id (email-independent).
          Does not change if user changes their email address.
        tests: [unique, not_null]

      - name: internal_user_id
        description: "Internal DB user ID. Anchor for surrogate key generation."
        tests: [not_null]

      - name: email
        description: "Raw user email address."
        tests: [not_null]

      - name: account_id
        description: >
          FK to int_accounts_joined. Resolved via direct workspace match or L2A domain match.
          NULL when unmatched.

      - name: match_method
        description: "Identity resolution method: direct_match | domain_match | unmatched."
        tests:
          - accepted_values:
              values: ['direct_match', 'domain_match', 'unmatched']

  # ===========================================================================
  # LAYER 2: Domain Aggregations
  # ===========================================================================

  - name: int_billing_aggregated
    description: >
      Consolidates Stripe data (subscriptions, invoices, payments) at the workspace grain.
      Computes active MRR, churn risk indicators, seat utilization, and worst payment failure categories.
      account_id is added downstream in 3_integration via int_accounts_joined.
    columns:
      - name: workspace_id
        description: "Grain — Stripe metadata workspace_id. FK to stg_internal__workspaces."
        tests: [unique, not_null]

      - name: active_mrr
        description: "Monthly recurring revenue from active subscriptions only."
        tests: [not_null]

      - name: total_mrr
        description: "Total recurring revenue across all subscription states including trialing."
        tests: [not_null]

      - name: latest_subscription_status
        description: >
          Most recent subscription status (recency_rank=1).
          Uses window ranking to prevent MAX(status) logic bugs.

      - name: current_plan
        description: "Most recent plan_id."

      - name: is_payment_failing
        description: >
          1 = Subscription has past_due state (silent churn risk).
          0 = Normal payment state.

      - name: is_churning_soon
        description: >
          1 = cancel_at_period_end is true (intent churn signal).
          0 = Cancellation not scheduled.

      - name: seats_purchased
        description: "Stripe subscription quantity — purchased seat count."

      - name: seats_used
        description: "Actual active users from internal product database."

      - name: seat_utilization_pct
        description: "seats_used / seats_purchased ratio. 0.9+ indicates upsell readiness."

      - name: is_upsell_candidate
        description: "True when seat_utilization_pct >= 0.9."

      - name: is_downsell_risk
        description: "True when seats_purchased > 1 and seat_utilization_pct < 0.3."

      - name: payment_failure_category
        description: >
          Highest severity payment failure category:
          card_issue | funds_issue | fraud_risk | other | NULL (successful).

      - name: is_trial_at_risk
        description: "Trial expires within 3 days with no payment history."

      - name: first_payment_at
        description: "Timestamp of first successful payment (trial-to-paid conversion)."

  - name: int_crm_aggregated
    description: >
      Consolidates HubSpot CRM data (deals, engagements) at the company grain.
      Computes lifetime revenue, won/lost counts, activity volumes, and pipeline velocity metrics.
    columns:
      - name: hubspot_company_id
        description: "Grain — HubSpot company ID."
        tests: [unique, not_null]

      - name: open_deals_count
        description: "Current count of active open deals."
        tests: [not_null]

      - name: won_deals_count
        description: "Total closed-won deal count."
        tests: [not_null]

      - name: lifetime_revenue
        description: "Cumulative revenue from all closed-won deals in USD."
        tests: [not_null]

      - name: stale_deals_count
        description: "Open deals active for over 90 days (pipeline friction signal)."
        tests: [not_null]

      - name: avg_days_to_close_won
        description: "Average days to close for won deals."

      - name: weighted_pipeline_value
        description: "Sum of open deal amounts multiplied by win probability."
        tests: [not_null]

      - name: total_activities
        description: "Total logged sales engagement activities (CALL + EMAIL + MEETING)."
        tests: [not_null]

      - name: last_engagement_at
        description: "Timestamp of most recent CRM engagement."

  - name: int_product_aggregated
    description: >
      Consolidates PostHog telemetry events and user stats at the workspace grain.
      Computes activation rates, PQL signals, and low-engagement churn risk.
    columns:
      - name: workspace_id
        description: "Grain — internal workspace ID."
        tests: [unique, not_null]

      - name: total_product_events
        description: "Total telemetry events logged for this workspace."
        tests: [not_null]

      - name: last_activity_at
        description: "Timestamp of last product activity. NULL if never active."

      - name: has_connected_git
        description: "Boolean flag for git_integration_connected milestone."

      - name: has_started_sprint
        description: "Boolean flag for sprint_started milestone."

      - name: is_pql
        description: "Product Qualified Lead flag (has_connected_git AND has_started_sprint)."

      - name: total_users
        description: "Total registered users belonging to this workspace."
        tests: [not_null]

      - name: activated_users
        description: "Users who completed the activation milestone."
        tests: [not_null]

      - name: activation_rate
        description: >
          activated_users / total_users ratio (range 0.0 to 1.0).
        tests: [not_null]

      - name: is_low_engagement
        description: >
          True if last_activity_at is NULL or older than 30 days.
          Includes NULL guard: Never-active workspaces present severe churn risk.

  - name: int_support_aggregated
    description: >
      Aggregates Zendesk support tickets at the account grain.
      Uses DISTINCT email_to_account CTE to prevent user-level fan-out multiplication.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: total_tickets
        description: "Total support tickets created for this account."
        tests: [not_null]

      - name: open_tickets
        description: "Count of active unresolved tickets (new | open | pending)."
        tests: [not_null]

      - name: high_priority_tickets
        description: "Count of urgent or high-priority support tickets."
        tests: [not_null]

      - name: avg_resolution_hours
        description: "Average resolution duration in hours. NULL if no resolved tickets exist."

      - name: last_ticket_at
        description: "Timestamp of most recent support ticket."

  - name: int_icp_scoring
    description: >
      Computes ICP (Ideal Customer Profile) Fit Score and account segmentation tier.
      Combines industry, employee count, and ARR data into icp_score and icp_tier.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: account_segment
        description: "ARR-based revenue segment: Enterprise | Mid-Market | SMB | Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

      - name: icp_score
        description: "Composite ICP score (range 0 to 100)."

      - name: icp_tier
        description: "ICP Fit classification tier: High Fit (>=70) | Medium Fit (>=30) | Low Fit."
        tests:
          - accepted_values:
              values: ['High Fit', 'Medium Fit', 'Low Fit']

  - name: int_deals_enriched
    description: >
      Granular deal-level enrichment model (1 row per deal) linking HubSpot deals with account context.
      Replaces direct staging dependencies in fct_pipeline (resolves dbt Anti-pattern #13).
    columns:
      - name: hubspot_deal_id
        description: "Grain — HubSpot deal ID."
        tests: [unique, not_null]

      - name: hubspot_company_id
        description: "FK to stg_hubspot__companies."

      - name: account_id
        description: "FK to int_accounts_joined."

      - name: amount
        description: "Deal value in USD."
        tests: [not_null]

      - name: weighted_amount
        description: "amount * probability / 100 for revenue forecasting."

      - name: is_won
        description: "True if deal stage is closedwon."

      - name: is_lost
        description: "True if deal stage is closedlost."

      - name: is_open
        description: "True if deal is currently active (neither closedwon nor closedlost)."

      - name: is_stale
        description: "True if open deal has been inactive for over 90 days."

      - name: days_to_close
        description: "Duration from deal creation to close date in days."

      - name: deal_age_bucket
        description: "Age bucket: 0-30d | 31-60d | 61-90d | 90+ days (Stale) | Closed."

  # ===========================================================================
  # LAYER 3: Integration
  # ===========================================================================

  - name: int_accounts_integrated
    description: >
      Account 360 — Consolidates all domain aggregations onto the global account spine.
      Materialized as a TABLE for high-performance querying by downstream marts.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: mrr
        description: "Total account MRR from int_billing_aggregated."
        tests: [not_null]

      - name: is_payment_failing
        description: "1 = past_due subscription exists (from int_billing_aggregated)."

      - name: is_churning_soon
        description: "1 = cancel_at_period_end is true (from int_billing_aggregated)."

      - name: is_low_engagement
        description: >
          True if last_activity_at is NULL or older than 30 days.
          Sourced from int_product_aggregated.

      - name: account_segment
        description: "ARR-based segment tier from int_icp_scoring."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

      - name: icp_score
        description: "ICP Fit score from int_icp_scoring."

      - name: icp_tier
        description: "ICP tier from int_icp_scoring: High Fit | Medium Fit | Low Fit."

  - name: int_accounts_scored
    description: >
      Applies multi-signal health scoring onto int_accounts_integrated.
      Consumed directly by dim_accounts in Marts.
      Scoring priority cascade: Churned > Payment Failing > Support Critical > Low Engagement > Expansion Target > Healthy.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: health_reason
        description: >
          Primary cause for health status:
          Churned | Payment Failing | Support Critical |
          Low Engagement | Expansion Target | Healthy.
        tests:
          - accepted_values:
              values:
                - 'Churned'
                - 'Payment Failing'
                - 'Support Critical'
                - 'Low Engagement'
                - 'Expansion Target'
                - 'Healthy'

      - name: health_status
        description: "High-level health status category: Healthy | At Risk | Churned."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']

      - name: mrr_at_risk
        description: >
          MRR exposure for At Risk accounts (derived from health_reason to prevent drift).
        tests: [not_null]
