version: 2

models:
  # ---------------------------------------------------------------------------
  # Layer 1: Identity
  # ---------------------------------------------------------------------------
  - name: int_accounts_joined
    description: >
      Global account identity spine. Merges internal workspaces (primary), 
      HubSpot CRM companies, and CRM-only leads into a single deduplicated
      account record with a stable surrogate key.
    columns:
      - name: account_id
        description: "Stable surrogate key. Anchor for all downstream joins."
        tests: [unique, not_null]
      - name: internal_workspace_id
        description: "FK to internal product workspace. NULL for CRM-only leads."

  - name: int_users_joined
    description: >
      Links internal product users to HubSpot contacts via case-insensitive
      email match and resolves their parent account_id.
    columns:
      - name: global_user_id
        description: "Surrogate key based on internal_user_id (email-independent)."
        tests: [unique, not_null]
      - name: email
        tests: [not_null]

  # ---------------------------------------------------------------------------
  # Layer 2: Domain Aggregations & Enrichments
  # ---------------------------------------------------------------------------
  - name: int_billing_aggregated
    description: >
      Consolidated billing metrics per workspace from Stripe. Combines subscriptions,
      invoices, and payments. Computes active MRR, churn risk indicators, seat utilization,
      and worst payment failure categories.
    columns:
      - name: workspace_id
        description: "Primary key for workspace billing aggregation."
        tests: [unique, not_null]
      - name: active_mrr
        description: "Active monthly recurring revenue in USD."
        tests: [not_null]
      - name: total_mrr
        description: "Total recurring revenue including trialing plans in USD."
        tests: [not_null]

  - name: int_crm_aggregated
    description: >
      Consolidated CRM sales pipeline and engagement metrics per HubSpot company.
    columns:
      - name: hubspot_company_id
        description: "Primary key for CRM aggregation."
        tests: [unique, not_null]

  - name: int_deals_enriched
    description: >
      Deal-level enrichment model linking HubSpot deals with account context.
      Replaces direct staging dependency in fct_pipeline (resolves Anti-pattern #13).
    columns:
      - name: hubspot_deal_id
        description: "Primary key for HubSpot deals."
        tests: [unique, not_null]

  - name: int_support_aggregated
    description: >
      Support health metrics per account from Zendesk.
    columns:
      - name: account_id
        description: "Primary key for support aggregation."
        tests: [unique, not_null]

  - name: int_product_aggregated
    description: >
      Product usage and PLG signals from PostHog events and user adoption.
    columns:
      - name: workspace_id
        description: "Primary key for product usage aggregation."
        tests: [unique, not_null]

  # ---------------------------------------------------------------------------
  # Layer 2 (extra): ICP Scoring
  # ---------------------------------------------------------------------------
  - name: int_icp_scoring
    description: >
      ICP (Ideal Customer Profile) Fit Score per account.
      Scores accounts by industry, employee count, and MRR.
    columns:
      - name: account_id
        description: "Stable surrogate key — joins to dim_accounts."
        tests: [unique, not_null]
      - name: account_segment
        description: "Revenue-based tier: Enterprise / Mid-Market / SMB / Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']
      - name: icp_tier
        description: "ICP Fit classification: High Fit / Medium Fit / Low Fit."
        tests:
          - accepted_values:
              values: ['High Fit', 'Medium Fit', 'Low Fit']

  # ---------------------------------------------------------------------------
  # Layer 3: Integration (Final Output of Intermediate)
  # ---------------------------------------------------------------------------
  - name: int_accounts_integrated
    description: >
      Full Account 360° view. Joins all domain aggregations onto the account
      spine. Materialized as TABLE for mart query performance.
    columns:
      - name: account_id
        description: "Primary key for integrated accounts."
        tests: [unique, not_null]
      - name: mrr
        description: "Total account MRR."
        tests: [not_null]
      - name: account_segment
        description: "Account segment."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

  - name: int_accounts_scored
    description: >
      Multi-signal health scoring model. Scoring priority: Churned >
      Payment Failing > Support Critical > Low Engagement > Expansion Target > Healthy.
    columns:
      - name: account_id
        description: "Primary key for scored accounts."
        tests: [unique, not_null]
      - name: health_status
        description: "Overall account health status."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']
      - name: health_reason
        description: "Detailed cause for health status."
        tests:
          - accepted_values:
              values: ['Healthy', 'Payment Failing', 'Support Critical',
                       'Low Engagement', 'Expansion Target', 'Churned']
