version: 2

# =============================================================================
# INTERMEDIATE LAYER — Schema va Testlar
#
# Testing falsafasi:
#   1_identity → surrogate key unique + not_null (barqarorlik kafolati)
#   2_domains  → grain ustuni unique + not_null, muhim FK lar not_null
#   3_integration → account_id unique + not_null, biznes qiymatlar not_null
#
# Qoida: biznes metrikalar (MRR summasi, ticket soni) INT da SINOVDAN O'TMAYDI
#        — bu mart va integratsiya testlari ishi.
# =============================================================================

models:

  # ===========================================================================
  # LAYER 1: Identity
  # ===========================================================================

  - name: int_accounts_joined
    description: >
      Global account identity spine. Internal workspaces (birlamchi) +
      HubSpot companies (enrichment) + CRM-only leads (UNION ALL).
      Barcha downstream modellar shu surrogate key ga join qiladi.
    columns:
      - name: account_id
        description: >
          Barqaror surrogate key. coalesce(hubspot_company_id, internal_workspace_id)
          asosida yaratilgan. Barcha downstream join lar uchun anchor.
        tests: [unique, not_null]

      - name: internal_workspace_id
        description: "FK to stg_internal__workspaces. CRM-only leadlar uchun NULL."

      - name: hubspot_company_id
        description: "FK to stg_hubspot__companies. Workspacesiz CRM recordlar uchun bor."

      - name: domain
        description: "Company domain. L2A (Lead-to-Account) fuzzy join uchun ishlatiladi."

      - name: workspace_name
        description: "Display nomi. workspace_name yo'q bo'lsa hubspot company_name."

  - name: int_users_joined
    description: >
      Global user identity spine. Internal users + HubSpot contacts email orqali.
      L2A fallback: direct workspace match yo'q bo'lsa domain orqali account topiladi.
      Generic domainlar (gmail.com va h.k.) generic_domains seed dan filtrlanadi.
    columns:
      - name: global_user_id
        description: >
          Barqaror surrogate key — internal_user_id asosida.
          Email asosida EMAS (email o'zgarishi mumkin → ID o'zgarib ketadi).
        tests: [unique, not_null]

      - name: internal_user_id
        description: "Internal DB user ID. Surrogate key asosi."
        tests: [not_null]

      - name: email
        description: "Asl email manzil."
        tests: [not_null]

      - name: account_id
        description: >
          FK to int_accounts_joined. Direct workspace match yoki L2A domain match.
          'unmatched' bo'lsa NULL.

      - name: match_method
        description: "Identity resolution usuli: direct_match | domain_match | unmatched."
        tests:
          - accepted_values:
              values: ['direct_match', 'domain_match', 'unmatched']

  # ===========================================================================
  # LAYER 2: Domain Aggregations
  # ===========================================================================

  - name: int_billing_aggregated
    description: >
      Stripe ning 3 ta jadvalidan (subscriptions, invoices, payments) workspace
      darajasida barcha billing metrikalarini hisoblaydi.

      OLDINGI MODELLAR:
        int_subscriptions_enriched + int_finance_aggregated + int_payments_enriched
        → BITTA MODEL (int_billing_aggregated)

      account_id bu yerda YO'Q — 3_integration da int_accounts_joined orqali qo'shiladi.
    columns:
      - name: workspace_id
        description: "Grain — Stripe metadata workspace_id. FK to stg_internal__workspaces."
        tests: [unique, not_null]

      - name: active_mrr
        description: "Faqat 'active' statusli subscriptionlardan MRR."
        tests: [not_null]

      - name: total_mrr
        description: "Barcha subscriptionlardan MRR (trialing ham kiradi)."
        tests: [not_null]

      - name: latest_subscription_status
        description: >
          Eng so'nggi subscription holati (recency_rank=1).
          MAX(status) xatosi oldini olish uchun recency_rank ishlatiladi.

      - name: current_plan
        description: "Eng so'nggi plan_id."

      - name: is_payment_failing
        description: >
          1 = past_due status bor (silent churn sinyal).
          0 = to'lovlar normal.

      - name: is_churning_soon
        description: >
          1 = cancel_at_period_end = true (intent churn sinyal).
          0 = bekor qilish rejalashtirilmagan.

      - name: seats_purchased
        description: "Stripe subscription quantity — sotib olingan o'rinlar soni."

      - name: seats_used
        description: "Haqiqiy foydalanilayotgan o'rinlar (internal DB dan, Stripe quantity emas)."

      - name: seat_utilization_pct
        description: "seats_used / seats_purchased. 0.9+ = upsell tayyor."

      - name: is_upsell_candidate
        description: "seat_utilization_pct >= 0.9 bo'lsa true."

      - name: is_downsell_risk
        description: "seats_purchased > 1 va seat_utilization_pct < 0.3 bo'lsa true."

      - name: payment_failure_category
        description: >
          Eng og'ir payment failure kategoriyasi.
          card_issue | funds_issue | fraud_risk | other | NULL (muvaffaqiyatli).

      - name: is_trial_at_risk
        description: "Trial 3 kun ichida tugaydi va to'lov yo'q."

      - name: first_payment_at
        description: "Birinchi muvaffaqiyatli to'lov sanasi (trial → paid konversiya)."

  - name: int_crm_aggregated
    description: >
      HubSpot ning 2 ta jadvalidan (deals, engagements) company darajasida
      barcha CRM metrikalarini hisoblaydi.

      OLDINGI MODELLAR:
        int_sales_aggregated (faqat deals)
        + fct_activities (mart da edi, engagements)
        → BITTA MODEL (int_crm_aggregated)

      Pipeline velocity sinyallari (stale_deals, avg_days_to_close) bu yerda.
    columns:
      - name: hubspot_company_id
        description: "Grain — HubSpot company ID."
        tests: [unique, not_null]

      - name: open_deals_count
        description: "Hozir ochiq bitimlar soni."
        tests: [not_null]

      - name: won_deals_count
        description: "Yopilgan-yutilgan bitimlar soni. Marketing attributsiyasi uchun."
        tests: [not_null]

      - name: lifetime_revenue
        description: "Barcha yopilgan-yutilgan bitimlardan umumiy daromad."
        tests: [not_null]

      - name: stale_deals_count
        description: "90 kundan ko'p ochiq qolgan bitimlar (pipeline tiqilib qolish sinyal)."
        tests: [not_null]

      - name: avg_days_to_close_won
        description: "Faqat yutilgan bitimlar uchun o'rtacha yopilish vaqti (kun)."

      - name: weighted_pipeline_value
        description: "Ochiq bitimlar: amount × probability. Revenue forecast uchun."
        tests: [not_null]

      - name: total_activities
        description: "Jami CRM faoliyat soni (CALL + EMAIL + MEETING)."
        tests: [not_null]

      - name: last_engagement_at
        description: "Oxirgi CRM aloqa vaqti."

  - name: int_product_aggregated
    description: >
      PostHog events + int_users_joined asosida workspace darajasida
      barcha product metrikalarini hisoblaydi.

      OLDINGI MODELLAR:
        int_usage_aggregated (faqat events)
        + activation_rate, is_low_engagement (mart da edi)
        → BITTA MODEL (int_product_aggregated)

      is_low_engagement bu yerda — fct_accounts_health dan ko'chirildi.
      activation_rate bu yerda — fct_product_activation dan ko'chirildi.
    columns:
      - name: workspace_id
        description: "Grain — internal workspace ID."
        tests: [unique, not_null]

      - name: total_product_events
        description: "Jami product telemetriya eventlari."
        tests: [not_null]

      - name: last_activity_at
        description: "Oxirgi product event vaqti. NULL = hech qachon ishlatmagan."

      - name: has_connected_git
        description: "git_integration_connected eventi bo'lganmi."

      - name: has_started_sprint
        description: "sprint_started eventi bo'lganmi."

      - name: is_pql
        description: "has_connected_git AND has_started_sprint = Product Qualified Lead."

      - name: total_users
        description: "Workspace dagi jami foydalanuvchilar."
        tests: [not_null]

      - name: activated_users
        description: "Aktivatsiya milestoneini bajargan foydalanuvchilar."
        tests: [not_null]

      - name: activation_rate
        description: >
          activated_users / total_users. 0–1 oralig'ida.
          Oldin fct_product_activation da hisoblandi.
        tests: [not_null]

      - name: is_low_engagement
        description: >
          last_activity_at NULL bo'lsa YOKI 30 kundan eski bo'lsa true.
          NULL guard muhim: hech qachon ishlatmagan = eng katta churn xavfi.
          Oldin fct_accounts_health da CASE edi.

  - name: int_support_aggregated
    description: >
      Zendesk ticketlarini email → account_id orqali boglab,
      account darajasida support metrikalarini hisoblaydi.

      O'ZGARISH:
        Fan-out muammosi tuzatildi. Oldin int_users_joined ga to'g'ri JOIN qilinardi
        → 1 account × N user × M ticket = N×M row chiqishi mumkin edi.
        Endi email_to_account CTE DISTINCT bilan — har email bir account_id.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: total_tickets
        description: "Jami support ticketlari."
        tests: [not_null]

      - name: open_tickets
        description: "Hozir ochiq ticketlar (new | open | pending)."
        tests: [not_null]

      - name: high_priority_tickets
        description: "Urgent yoki high priorityli ticketlar (eskalatsiya sinyal)."
        tests: [not_null]

      - name: avg_resolution_hours
        description: "O'rtacha hal etish vaqti (soat). NULL = hali hal etilmagan ticket yo'q."

      - name: last_ticket_at
        description: "Oxirgi ticket sanasi."

  - name: int_icp_scoring
    description: >
      Account darajasida ICP (Ideal Customer Profile) Fit Score.
      industry + account_segment + revenue → icp_score → icp_tier.
      fct_pql_signals da GTM Priority Matrix uchun ishlatiladi.

      O'ZGARISH:
        int_finance_aggregated → int_billing_aggregated (yangi model nomi).
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: account_segment
        description: "ARR asosida tier: Enterprise | Mid-Market | SMB | Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

      - name: icp_score
        description: "Umumiy ICP bali (industry + segment + revenue). 0–100."

      - name: icp_tier
        description: "ICP klassifikatsiya: High Fit (>=70) | Medium Fit (>=30) | Low Fit."
        tests:
          - accepted_values:
              values: ['High Fit', 'Medium Fit', 'Low Fit']

  - name: int_deals_enriched
    description: >
      Deal-level ma'lumot account context bilan boyitilgan.
      YANGI MODEL — oldin fct_pipeline stg_hubspot__deals ga to'g'ri murojaat qilardi.

      Sabab: Mart STG ni bilmasligi kerak (antipattern #13).
      fct_pipeline shu modeldan oladi.
      int_crm_aggregated dan farqi: bu deal-level (agregatsiya yo'q).

      days_to_close, is_stale, deal_age_bucket, weighted_amount bu yerda.
      Oldin fct_pipeline da hisoblandi.
    columns:
      - name: hubspot_deal_id
        description: "Grain — HubSpot deal ID."
        tests: [unique, not_null]

      - name: hubspot_company_id
        description: "FK to stg_hubspot__companies."

      - name: account_id
        description: "FK to int_accounts_joined (int_deals_enriched orqali keladi)."

      - name: amount
        description: "Bitim qiymati USD da."
        tests: [not_null]

      - name: weighted_amount
        description: "amount × probability / 100. Revenue forecast uchun."

      - name: is_won
        description: "closedwon bo'lsa true."

      - name: is_lost
        description: "closedlost bo'lsa true."

      - name: is_open
        description: "Ochiq (closedwon yoki closedlost emas) bo'lsa true."

      - name: is_stale
        description: "90 kundan ko'p ochiq — pipeline tiqilib qolish sinyal."

      - name: days_to_close
        description: "Yaratilishdan yopilishgacha kun soni."

      - name: deal_age_bucket
        description: "Yosh kategoriyasi: 0-30d | 31-60d | 61-90d | 90+ days (Stale) | Closed."

  # ===========================================================================
  # LAYER 3: Integration
  # ===========================================================================

  - name: int_accounts_integrated
    description: >
      Account 360 — barcha domain aggregationlar account spine ga birlashgan.
      materialized='table': mart lar ko'p so'raydi.

      O'ZGARISHLAR:
        int_finance_aggregated  → int_billing_aggregated
        int_sales_aggregated    → int_crm_aggregated
        int_usage_aggregated    → int_product_aggregated
        is_low_engagement       → int_product_aggregated dan keladi
        account_segment         → int_icp_scoring dan keladi (bir joyda)

      Yangi biznes mantiq QO'SHILMADI — faqat domain modellar birlashtirildi.
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: mrr
        description: "Workspace total MRR (int_billing_aggregated dan)."
        tests: [not_null]

      - name: is_payment_failing
        description: "1 = past_due subscription bor (int_billing_aggregated dan)."

      - name: is_churning_soon
        description: "1 = cancel_at_period_end = true (int_billing_aggregated dan)."

      - name: is_low_engagement
        description: >
          true = last_activity_at NULL yoki 30 kundan eski.
          int_product_aggregated dan keladi (oldin fct_accounts_health da edi).

      - name: account_segment
        description: "int_icp_scoring dan: Enterprise | Mid-Market | SMB | Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

      - name: icp_score
        description: "ICP bali (int_icp_scoring dan)."

      - name: icp_tier
        description: "ICP tier (int_icp_scoring dan): High Fit | Medium Fit | Low Fit."

  - name: int_accounts_scored
    description: >
      int_accounts_integrated + health scoring.
      dim_accounts shu modeldan oladi.

      O'ZGARISHLAR:
        is_low_engagement → int_accounts_integrated dan keladi (mart da edi)
        health_reason → 3 ta churn sinyal to'liq: Payment Failing + Support Critical + Low Engagement
        mrr_at_risk → health_reason dan derivatsiya (drift oldini olish)

      SCORING TARTIBI:
        Churned > Payment Failing > Support Critical > Low Engagement > Expansion Target > Healthy
    columns:
      - name: account_id
        description: "Grain — FK to int_accounts_joined."
        tests: [unique, not_null]

      - name: health_reason
        description: >
          Aniq sabab (CS jamoasi uchun):
          Churned | Payment Failing | Support Critical |
          Low Engagement | Expansion Target | Healthy
        tests:
          - accepted_values:
              values:
                - 'Churned'
                - 'Payment Failing'
                - 'Support Critical'
                - 'Low Engagement'
                - 'Expansion Target'
                - 'Healthy'

      - name: health_status
        description: "Yuqori darajali holat: Healthy | At Risk | Churned."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']

      - name: mrr_at_risk
        description: >
          At Risk (Churned emas) accountlar uchun MRR.
          health_reason dan derivatsiya qilingan.
        tests: [not_null]
