version: 2

# =============================================================================
# MART SCHEMA: Core
# dim_accounts + dim_users — barcha jamoalar uchun foundation.
# Testing falsafasi: grain (unique+not_null) + biznes qiymatlar (not_null, accepted_values).
# =============================================================================

models:

  # ─── dim_accounts ──────────────────────────────────────────────────────────
  - name: dim_accounts
    description: >
      Golden Record — har bir B2B account uchun yagona haqiqat manbai.
      int_accounts_scored dan faqat SELECT. Yangi biznes mantiq bu yerda yo'q.
      Barcha GTM jamoalari shu modeldan foydalanadi.
    columns:
      - name: account_id
        description: "Barqaror surrogate key. Barcha downstream join lar uchun."
        tests: [unique, not_null]

      - name: domain
        description: "Company domain. Asosiy identity kaliti."
        tests: [not_null]

      - name: mrr
        description: "Monthly Recurring Revenue (USD)."
        tests: [not_null]

      - name: arr
        description: "Annualized Recurring Revenue (mrr × 12). Yagona mart hisob-kitobi."

      - name: account_segment
        description: "ARR asosida tier: Enterprise | Mid-Market | SMB | Trial/Free."
        tests:
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Trial/Free']

      - name: health_status
        description: "Account health holati: Healthy | At Risk | Churned."
        tests:
          - accepted_values:
              values: ['Healthy', 'At Risk', 'Churned']

      - name: health_reason
        description: >
          Aniq sabab: Churned | Payment Failing | Support Critical |
          Low Engagement | Expansion Target | Healthy.
        tests:
          - accepted_values:
              values:
                - 'Churned'
                - 'Payment Failing'
                - 'Support Critical'
                - 'Low Engagement'
                - 'Expansion Target'
                - 'Healthy'

      - name: mrr_at_risk
        description: "At Risk accountlar uchun MRR. health_reason dan derivatsiya."
        tests: [not_null]

      - name: icp_tier
        description: "ICP Fit: High Fit | Medium Fit | Low Fit."
        tests:
          - accepted_values:
              values: ['High Fit', 'Medium Fit', 'Low Fit']

      - name: seat_utilization_pct
        description: "seats_used / seats_purchased. 0.0–1.0 oralig'ida."
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 1.0

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1

  # ─── dim_users ─────────────────────────────────────────────────────────────
  - name: dim_users
    description: >
      Boyitilgan user directory. PII masking bu yerda (GDPR/CCPA).
      int_users_joined dan SELECT + email/name masking.
    columns:
      - name: global_user_id
        description: "Barqaror surrogate key (internal_user_id asosida, email emas)."
        tests: [unique, not_null]

      - name: email
        description: "Masklangan email (j***e@domain.com)."
        tests: [not_null]

      - name: hashed_email
        description: "MD5 hash — downstream identity stitching uchun."
        tests: [not_null]

      - name: account_id
        description: "FK to dim_accounts."
        tests: [not_null]
