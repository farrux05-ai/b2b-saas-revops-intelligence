version: 2

# =============================================================================
# SNAPSHOTS: SCD Type 2 (Slowly Changing Dimensions)
# dbt v1.9+ YAML format (No SQL files required)
#
# Goal: Maintain historical tracking when critical source attributes change.
# Strategy: `check` — opens a new historical record only when specified check columns change.
#   This is safer and more predictable than the `timestamp` strategy for API integrations.
#
# Automatically appended dbt columns (included in every snapshot table):
#   dbt_scd_id      → Surrogate key for each unique historical row version
#   dbt_updated_at  → Timestamp when the row version was processed (dbt run time)
#   dbt_valid_from  → Start timestamp when this row version became active
#   dbt_valid_to    → End timestamp for this row version (NULL indicates active/current state)
#
# Relation Syntax: source('source_name', 'table_name')
#   — Pure string format required in dbt 1.9+ (No quotes or Jinja delimiters needed)
# =============================================================================

snapshots:

  # ─── 1. Stripe Subscriptions ─────────────────────────────────────────────
  # Why it is CRITICAL:
  #   - Track plan upgrades/downgrades (cohort MRR analysis)
  #   - "When did status drop to past_due?" → Crucial churn prediction signal
  #   - "When was the cancel flag set?" → Early warning indicator for CS
  #
  # Downstream usage examples:
  #   -- Retrieve current states:
  #   SELECT * FROM snapshots.snap_stripe_subscriptions WHERE dbt_valid_to IS NULL
  #   -- Track historical plan migrations (who, when, from which plan to which):
  #   SELECT id, plan_id, status, dbt_valid_from, dbt_valid_to
  #   FROM snapshots.snap_stripe_subscriptions ORDER BY id, dbt_valid_from
  # ──────────────────────────────────────────────────────────────────────────
  - name: snap_stripe_subscriptions
    relation: source('stripe', 'subscriptions')
    description: >
      SCD Type 2 snapshot of Stripe subscriptions.
      Tracks plan migrations, status changes (active → past_due → canceled),
      and cancel-at-period-end flags over time.
    config:
      target_schema: snapshots
      strategy: check
      unique_key: id
      check_cols:
        - status
        - plan_id
        - unit_amount
        - quantity
        - cancel_at_period_end
    columns:
      - name: dbt_valid_from
        description: "Timestamp when this version of the row became active."
      - name: dbt_valid_to
        description: "Timestamp when this version was superseded. NULL means it's the current record."

  # ─── 2. HubSpot Deals ────────────────────────────────────────────────────
  # Why it is CRITICAL:
  #   - Deal stage regressions: Track backward movements like "Closed Won → Closed Lost"
  #   - Sales velocity: Measure actual time spent in each pipeline stage
  #   - Forecast accuracy: Monitor changes in Deal Amount (e.g., discounts applied)
  #
  # Downstream usage examples:
  #   -- Days spent in each pipeline stage:
  #   SELECT hs_object_id, dealstage, dbt_valid_from, dbt_valid_to,
  #          datediff('day', dbt_valid_from, coalesce(dbt_valid_to, current_timestamp))
  #          AS days_in_stage
  #   FROM snapshots.snap_hubspot_deals ORDER BY hs_object_id, dbt_valid_from
  # ──────────────────────────────────────────────────────────────────────────
  - name: snap_hubspot_deals
    relation: source('hubspot', 'deals')
    description: >
      SCD Type 2 snapshot of HubSpot deals.
      Tracks stage progressions and regressions, deal amount changes,
      and close date revisions for sales velocity and pipeline integrity analysis.
    config:
      target_schema: snapshots
      strategy: check
      unique_key: hs_object_id
      check_cols:
        - dealstage
        - amount
        - closedate
        - hs_deal_stage_probability
    columns:
      - name: dbt_valid_from
        description: "Timestamp when this deal stage/amount version became active."
      - name: dbt_valid_to
        description: "Timestamp when this version was superseded. NULL means current record."

  # ─── 3. HubSpot Companies (Lifecycle Stage) ──────────────────────────────
  # Why it is CRITICAL:
  #   - Track timestamps for transitions: "Lead → MQL → SQL → Customer"
  #   - Conversion time analytics (how many days from Lead to Customer?)
  #   - Funnel attribution: Map campaigns to the exact historical window when MQL status was hit
  #
  # NOTE: Excluded static fields like industry or country since they rarely change
  #   and do not provide value for historical snapshots.
  #
  # Downstream usage examples:
  #   -- Lifecycle stage transition history:
  #   SELECT hs_object_id, lifecyclestage, dbt_valid_from, dbt_valid_to,
  #          datediff('day', dbt_valid_from, coalesce(dbt_valid_to, current_timestamp))
  #          AS days_in_stage
  #   FROM snapshots.snap_hubspot_companies ORDER BY hs_object_id, dbt_valid_from
  # ──────────────────────────────────────────────────────────────────────────
  - name: snap_hubspot_companies
    relation: source('hubspot', 'companies')
    description: >
      SCD Type 2 snapshot of HubSpot company lifecycle stages.
      Tracks Lead → MQL → SQL → Customer progressions with timestamps
      to enable funnel velocity and time-to-convert analysis.
    config:
      target_schema: snapshots
      strategy: check
      unique_key: hs_object_id
      check_cols:
        - lifecyclestage
        - hs_lead_status
    columns:
      - name: dbt_valid_from
        description: "Timestamp when this lifecycle stage became active."
      - name: dbt_valid_to
        description: "Timestamp when this stage was superseded. NULL means current record."
