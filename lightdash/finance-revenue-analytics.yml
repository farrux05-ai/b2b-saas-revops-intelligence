      hideTitle: false
      content: |-
        **NRR (Net Revenue Retention):** Expansion kiradi. 100%+ = o'sish churni bosib o'tyapti. Best-in-class: 120%+

        **GRR (Gross Revenue Retention):** Expansion kiritilmaydi. Ceiling = 100%. Sog'lom SaaS: 85%+

        **Waterfall turlari:** `new` — yangi account | `expansion` — ko'proq to'layapti | `contraction` — kamroq | `churn` — nolga tushdi | `resurrection` — qaytib keldi | `retained` — o'zgarmadi

