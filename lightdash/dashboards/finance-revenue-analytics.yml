      title: "Metric Definitions"
      hideTitle: false
      content: |-
        **NRR (Net Revenue Retention):** Includes expansion. 100%+ indicates expansion outpaces churn. Benchmark: 120%+

        **GRR (Gross Revenue Retention):** Excludes expansion. Maximum ceiling = 100%. Healthy SaaS benchmark: 85%+

        **Waterfall Categories:** `new` — new account | `expansion` — revenue increase | `contraction` — revenue decrease | `churn` — account cancelled | `resurrection` — returned customer | `retained` — unchanged revenue

