contentType: chart
name: MRR Waterfall (Trailing 12 Months)
slug: mrr-waterfall-by-month
tableName: fct_retention_cohorts
spaceSlug: finance
version: 1
metricQuery:
  exploreName: fct_retention_cohorts
  dimensions:
    - fct_retention_cohorts_month_date
  # FIX: new_mrr, expansion_mrr, contraction_mrr, churned_mrr — bular METRIC (sum aggregate),
  # dimensions ichida bo'lsa Lightdash ularni aggregatsiya qilmaydi, raw row qaytaradi.
  # To'g'ri joy: metrics bloki.
  metrics:
    - fct_retention_cohorts_sum_new_mrr
    - fct_retention_cohorts_sum_expansion_mrr
    - fct_retention_cohorts_sum_contraction_mrr
    - fct_retention_cohorts_sum_churned_mrr
  filters: {}
  sorts:
    - fieldId: fct_retention_cohorts_month_date
      descending: false
  tableCalculations: []
  limit: 500
chartConfig:
  type: cartesian
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_sum_new_mrr
          name: "New MRR"
          type: bar
          stack: waterfall
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_sum_expansion_mrr
          name: "Expansion MRR"
          type: bar
          stack: waterfall
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_sum_contraction_mrr
          name: "Contraction MRR"
          type: bar
          stack: waterfall
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_sum_churned_mrr
          name: "Churned MRR"
          type: bar
          stack: waterfall
    layout:
      xField: fct_retention_cohorts_month_date
      yField:
        - fct_retention_cohorts_sum_new_mrr
        - fct_retention_cohorts_sum_expansion_mrr
        - fct_retention_cohorts_sum_contraction_mrr
        - fct_retention_cohorts_sum_churned_mrr
