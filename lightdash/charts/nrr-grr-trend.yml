contentType: chart
name: NRR vs GRR Trend (Trailing 12 Months)
slug: nrr-grr-trend
tableName: fct_retention_cohorts
spaceSlug: finance
version: 1
metricQuery:
  exploreName: fct_retention_cohorts
  dimensions:
    - fct_retention_cohorts_month_date
  # FIX: nrr_pct va grr_pct dimensions ichida edi — bu xato.
  # Lightdash dimensions = GROUP BY ustunlari (categorical yoki time).
  # nrr_pct / grr_pct — bu calculated numeric column, metrics blokida bo'lishi kerak.
  # finance.yml da ular average metric sifatida e'lon qilingan: avg_nrr, avg_grr.
  metrics:
    - fct_retention_cohorts_avg_nrr
    - fct_retention_cohorts_avg_grr
  filters: {}
  sorts:
    - fieldId: fct_retention_cohorts_month_date
      descending: false
  tableCalculations: []
  limit: 500
chartConfig:
  type: cartesian
  config:
    eChartsConfig:
      series:
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_avg_nrr
          name: "NRR %"
          type: line
        - encode:
            xRef:
              field: fct_retention_cohorts_month_date
            yRef:
              field: fct_retention_cohorts_avg_grr
          name: "GRR %"
          type: line
    layout:
      xField: fct_retention_cohorts_month_date
      yField:
        - fct_retention_cohorts_avg_nrr
        - fct_retention_cohorts_avg_grr
