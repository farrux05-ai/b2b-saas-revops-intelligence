# dagster_cloud.yaml
# ==================
# Tells Dagster Cloud where and how to load your Dagster code location.
#
# KEY CONCEPTS:
#   location (Code Location) — An isolated package of Dagster code in a repository.
#   A repository can have multiple code locations (e.g. monorepo setups).
#   Our location is "revops-intelligence".
#
# build.directory:
#   "." — Current directory = repository root.
#   Dagster Cloud will build the environment based on this directory's dependencies.
#
# SERVERLESS vs HYBRID:
#   Serverless (Current): Dagster Cloud hosts the execution in managed environments.
#     + No infrastructure to manage; scale to zero automatically.
#     + Ideal for standard pipelines and quickstarts.
#   Hybrid: You host an agent in your own infrastructure (Kubernetes, ECS, Docker).
#     + Data never leaves your network (important for compliance/GDPR).
#     + Ideal for heavy workloads and custom networking.

locations:
  - location_name: revops-intelligence

    code_source:
      # File where your Definitions object is instantiated.
      # Must align with module_name in pyproject.toml under [tool.dagster].
      python_file: dagster_pipeline.py

    build:
      # Directory used by Dagster Cloud CI to build the code location.
      # This directory contains requirements.txt or pyproject.toml.
      directory: .

      # registry: Used only in Hybrid deployment model.
      # If you build and push Docker images to your own ECR/GCR/DockerRegistry,
      # specify your image registry path here.
      # Serverless deployments use Dagster's built-in registry, so this is omitted.
      # Example:
      #   registry: 123456789.dkr.ecr.us-east-1.amazonaws.com/my-dagster-image:latest
